<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFriendsChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
}

header {
  background: #075e54;
  color: white;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h2 {
  margin: 0;
  font-size: 21px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
  font-size: 14px;
}

.primary {
  background: #087f68;
  color: white;
}

.secondary {
  background: #e2e8e6;
  color: #222;
}

.danger {
  background: #c62828;
  color: white;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 7px 0;
  font-size: 16px;
}

.container {
  max-width: 750px;
  margin: 0 auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
  box-shadow: 0 1px 4px #00000012;
}

.hidden {
  display: none !important;
}

nav {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 1px 4px #00000015;
}

nav button {
  flex: 1;
  background: #e6efec;
  color: #075e54;
  font-weight: bold;
}

nav button.active {
  background: #075e54;
  color: white;
}

.submenu {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.submenu button {
  flex: 1;
  min-width: 110px;
}

.person, .chat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 4px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.person:last-child, .chat-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #d9eee8;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #075e54;
  font-weight: bold;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info, .chat-info {
  flex: 1;
  min-width: 0;
}

.person-info strong, .chat-info strong {
  display: block;
  margin-bottom: 5px;
}

.preview {
  color: #66716e;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.time {
  color: #66716e;
  font-size: 11px;
  white-space: nowrap;
}

.online {
  color: #128c45;
  font-size: 12px;
}

.offline {
  color: #777;
  font-size: 12px;
}

#messages {
  height: 50vh;
  min-height: 250px;
  overflow-y: auto;
  padding: 12px;
  background: #e8e4dc;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  max-width: 82%;
  padding: 10px 12px;
  border-radius: 12px;
  background: white;
  overflow-wrap: anywhere;
  align-self: flex-start;
}

.message.mine {
  background: #d5f5cb;
  align-self: flex-end;
}

.message img, .message video {
  max-width: 100%;
  border-radius: 8px;
  display: block;
  margin-bottom: 6px;
}

.message small {
  display: block;
  margin-top: 5px;
  color: #65716b;
  font-size: 10px;
  text-align: right;
}

.composer {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-top: 10px;
}

.composer input {
  margin: 0;
}

.composer button {
  flex-shrink: 0;
}

#status {
  font-size: 13px;
  margin: 8px 0;
  color: #075e54;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #777;
}

@media (max-width: 420px) {
  .container {
    padding: 9px;
  }

  .card {
    padding: 11px;
  }

  .composer button {
    padding: 10px;
  }
}
</style>
</head>

<body>

<header>
  <h2>💬 JFriendsChat</h2>
  <button id="accountButton" class="secondary hidden"
          onclick="toggleAccount()">👤 Account</button>
</header>

<div class="container">

  <section id="authPanel" class="card">
    <h3>Welcome to JFriendsChat</h3>
    <p>Log in or create an account to chat with friends.</p>

    <input id="email" type="email" placeholder="Email address"
           autocomplete="email">

    <input id="password" type="password" placeholder="Password"
           autocomplete="current-password">

    <input id="username" placeholder="Username (for new accounts)">

    <button class="primary" onclick="signIn()">Log In</button>
    <button class="secondary" onclick="signUp()">Create Account</button>

    <div id="authStatus"></div>
  </section>

  <section id="appPanel" class="hidden">

    <nav>
      <button id="chatNav" class="active" onclick="openChatHome()">
        💬 Chat
      </button>

      <button id="friendsNav" onclick="openFriendsMenu()">
        👥 Friends
      </button>
    </nav>

    <div id="status"></div>

    <section id="chatPanel" class="card">
      <h3 id="chatHeading">Your Chats</h3>

      <div id="chatListView">
        <input id="chatSearch" placeholder="Search chats..."
               oninput="renderChatList()">

        <button class="secondary" onclick="refreshChatList()">
          🔄 Refresh chats
        </button>

        <div id="chatList"></div>
      </div>

      <div id="conversationView" class="hidden">
        <button class="secondary" onclick="backToChatList()">
          ← Back to chats
        </button>

        <h3 id="conversationName">Conversation</h3>
        <div id="conversationStatus"></div>

        <div id="messages"></div>

        <div class="composer">
          <input id="messageInput" placeholder="Type a message..."
                 onkeydown="if(event.key==='Enter') sendMessage()">

          <button class="primary" onclick="sendMessage()">Send</button>
        </div>

        <div class="composer">
          <input type="file" id="mediaInput"
                 accept="image/*,video/*">

          <button class="secondary" onclick="sendMedia()">
            📎 Send media
          </button>
        </div>
      </div>
    </section>

    <section id="friendsMenuPanel" class="card hidden">
      <h3>Friends</h3>

      <div class="submenu">
        <button class="primary" onclick="openFriendsList()">
          👥 My Friends
        </button>

        <button class="primary" onclick="openRequests()">
          📨 Friend Requests
        </button>

        <button class="primary" onclick="openFindFriends()">
          🔍 Find Friends
        </button>
      </div>
    </section>

    <section id="friendsPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>My Friends</h3>
      <div id="friendsList"></div>
    </section>

    <section id="requestsPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>Friend Requests</h3>

      <h4>Incoming Requests</h4>
      <div id="incomingRequests"></div>

      <h4>Sent Requests</h4>
      <div id="outgoingRequests"></div>
    </section>

    <section id="searchPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>Find Friends</h3>

      <input id="friendSearch" placeholder="Search by username..."
             oninput="searchFriends()">

      <div id="searchResults"></div>
    </section>

    <section id="accountPanel" class="card hidden">
      <h3>My Account</h3>
      <div id="accountDetails"></div>

      <input id="newUsername" placeholder="Change username">

      <button class="primary" onclick="updateUsername()">
        Save Username
      </button>

      <button class="danger" onclick="signOut()">Log Out</button>
    </section>

  </section>
</div>

<footer>JFriendsChat · Stay connected with your friends</footer>

<script>
/* ---------------------------------------------------
   SUPABASE CONFIGURATION
   Keep your own project's URL and publishable key.
--------------------------------------------------- */

const SUPABASE_URL =
  "https://msifvhqvxfjjwcazacxj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__uU2wBTvE8tWoAFoRSWVEA_AgJvZOqg";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let chatFriends = [];
let activeFriend = null;
let messageChannel = null;
let presenceChannel = null;
let knownOnlineUsers = new Set();
let renderedMessages = new Set();
let refreshTimer = null;

function el(id) {
  return document.getElementById(id);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function setStatus(message) {
  el("status").textContent = message || "";
}

function showAuthStatus(message) {
  el("authStatus").textContent = message || "";
}

function formatTime(dateValue) {
  if (!dateValue) return "";

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) return "";

  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();

  if (sameDay) {
    return date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  return date.toLocaleDateString([], {
    month: "short",
    day: "numeric"
  });
}

function displayName(profile) {
  return profile?.username ||
         profile?.display_name ||
         profile?.full_name ||
         "Friend";
}

function initials(name) {
  return (name || "F").trim().charAt(0).toUpperCase();
}

function avatarHTML(profile) {
  const name = displayName(profile);

  if (profile?.avatar_url) {
    return `<div class="avatar">
      <img src="${escapeHTML(profile.avatar_url)}" alt="">
    </div>`;
  }

  return `<div class="avatar">${escapeHTML(initials(name))}</div>`;
}

/* ---------------------------------------------------
   AUTHENTICATION
--------------------------------------------------- */

async function signUp() {
  const email = el("email").value.trim();
  const password = el("password").value;
  const username = el("username").value.trim();

  if (!email || !password || !username) {
    showAuthStatus("Enter your email, password and username.");
    return;
  }

  if (password.length < 6) {
    showAuthStatus("Your password must have at least 6 characters.");
    return;
  }

  showAuthStatus("Creating your account...");

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: { username }
    }
  });

  if (error) {
    showAuthStatus(error.message);
    return;
  }

  if (data.session) {
    await startApp(data.session.user);
  } else {
    showAuthStatus(
      "Account created. Check your email if confirmation is required, then log in."
    );
  }
}

async function signIn() {
  const email = el("email").value.trim();
  const password = el("password").value;

  if (!email || !password) {
    showAuthStatus("Enter your email and password.");
    return;
  }

  showAuthStatus("Logging in...");

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showAuthStatus(error.message);
    return;
  }

  await startApp(data.user);
}

async function signOut() {
  await stopPresence();

  if (messageChannel) {
    await db.removeChannel(messageChannel);
    messageChannel = null;
  }

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;
  activeFriend = null;

  el("appPanel").classList.add("hidden");
  el("authPanel").classList.remove("hidden");
  el("accountButton").classList.add("hidden");
  el("accountPanel").classList.add("hidden");

  showAuthStatus("You have logged out.");
}

async function startApp(user) {
  currentUser = user;

  el("authPanel").classList.add("hidden");
  el("appPanel").classList.remove("hidden");
  el("accountButton").classList.remove("hidden");

  await ensureProfile();
  await loadChatFriends();

  openChatHome();
  await renderChatList();
  await loadPresence();

  subscribeToMessages();
  await startPresence();

  if (refreshTimer) clearInterval(refreshTimer);

  refreshTimer = setInterval(async () => {
    if (!currentUser) return;

    await loadChatFriends();

    if (!activeFriend) {
      await renderChatList();
    } else {
      await loadPresence();
    }
  }, 15000);
}

/* ---------------------------------------------------
   PROFILE
--------------------------------------------------- */

async function ensureProfile() {
  const { data, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    setStatus("Could not load your profile: " + error.message);
    return;
  }

  if (data) {
    currentProfile = data;
    return;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const { data: created, error: insertError } = await db
    .from("profiles")
    .insert({
      id: currentUser.id,
      username
    })
    .select()
    .single();

  if (insertError) {
    setStatus(
      "Profile setup failed. Check your profiles table and its permissions: " +
      insertError.message
    );
    return;
  }

  currentProfile = created;
}

function toggleAccount() {
  hideAllPanels();

  el("accountPanel").classList.remove("hidden");
  el("accountDetails").textContent =
    "Email: " + (currentUser?.email || "") +
    " | Username: " + displayName(currentProfile);

  el("newUsername").value = displayName(currentProfile);
}

async function updateUsername() {
  const username = el("newUsername").value.trim();

  if (!username) {
    alert("Enter a username.");
    return;
  }

  const { data, error } = await db
    .from("profiles")
    .update({ username })
    .eq("id", currentUser.id)
    .select()
    .single();

  if (error) {
    alert("Could not update username: " + error.message);
    return;
  }

  currentProfile = data;
  el("accountDetails").textContent =
    "Email: " + currentUser.email +
    " | Username: " + displayName(currentProfile);

  alert("Username updated.");
}

/* ---------------------------------------------------
   NAVIGATION
--------------------------------------------------- */

function hideAllPanels() {
  [
    "chatPanel",
    "friendsMenuPanel",
    "friendsPanel",
    "requestsPanel",
    "searchPanel",
    "accountPanel"
  ].forEach(id => el(id).classList.add("hidden"));
}

function setNav(active) {
  el("chatNav").classList.toggle("active", active === "chat");
  el("friendsNav").classList.toggle("active", active === "friends");
}

async function openChatHome() {
  hideAllPanels();
  setNav("chat");

  el("chatPanel").classList.remove("hidden");
  el("chatListView").classList.remove("hidden");
  el("conversationView").classList.add("hidden");
  el("chatHeading").textContent = "Your Chats";

  activeFriend = null;

  await loadChatFriends();
  await renderChatList();
}

function openFriendsMenu() {
  hideAllPanels();
  setNav("friends");
  el("friendsMenuPanel").classList.remove("hidden");
}

function backToChatList() {
  activeFriend = null;
  el("conversationView").classList.add("hidden");
  el("chatListView").classList.remove("hidden");
  el("chatHeading").textContent = "Your Chats";
  renderChatList();
}

async function openFriendsList() {
  hideAllPanels();
  setNav("friends");
  el("friendsPanel").classList.remove("hidden");
  await loadFriendsList();
}

async function openRequests() {
  hideAllPanels();
  setNav("friends");
  el("requestsPanel").classList.remove("hidden");
  await loadRequests();
}

async function openFindFriends() {
  hideAllPanels();
  setNav("friends");
  el("searchPanel").classList.remove("hidden");
  await searchFriends();
}

/* ---------------------------------------------------
   FRIENDS
--------------------------------------------------- */

async function loadChatFriends() {
  if (!currentUser) return;

  const { data: requests, error } = await db
    .from("friend_requests")
    .select("*")
    .eq("status", "accepted")
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    );

  if (error) {
    setStatus("Could not load friends: " + error.message);
    return;
  }

  const ids = [...new Set((requests || []).map(request =>
    request.sender_id === currentUser.id
      ? request.receiver_id
      : request.sender_id
  ))].filter(id => id && id !== currentUser.id);

  if (!ids.length) {
    chatFriends = [];
    return;
  }

  const { data: profiles, error: profileError } = await db
    .from("profiles")
    .select("*")
    .in("id", ids);

  if (profileError) {
    setStatus("Could not load friend profiles: " + profileError.message);
    return;
  }

  chatFriends = profiles || [];
}

async function loadFriendsList() {
  await loadChatFriends();

  const container = el("friendsList");

  if (!chatFriends.length) {
    container.innerHTML =
      "<p>You have no friends yet. Find friends to get started.</p>";
    return;
  }

  container.innerHTML = chatFriends.map(friend => `
    <div class="person">
      ${avatarHTML(friend)}
      <div class="person-info">
        <strong>${escapeHTML(displayName(friend))}</strong>
        <span class="${knownOnlineUsers.has(friend.id) ? "online" : "offline"}">
          ${knownOnlineUsers.has(friend.id) ? "● Online" : "○ Offline"}
        </span>
      </div>
      <button class="primary"
        onclick="openConversation('${friend.id}')">Chat</button>
    </div>
  `).join("");
}

async function searchFriends() {
  if (!currentUser) return;

  const query = el("friendSearch").value.trim();
  const container = el("searchResults");

  if (query.length < 2) {
    container.innerHTML = "<p>Type at least two characters to search.</p>";
    return;
  }

  container.innerHTML = "<p>Searching...</p>";

  // Uses the search_friends RPC from your existing database.
  const { data, error } = await db.rpc("search_friends", {
    search_term: query
  });

  if (error) {
    container.innerHTML =
      "<p>Search failed: " + escapeHTML(error.message) +
      ". Check your search_friends function and its parameter name.</p>";
    return;
  }

  const results = (data || []).filter(
    person => person.id !== currentUser.id
  );

  if (!results.length) {
    container.innerHTML = "<p>No users found.</p>";
    return;
  }

  const { data: requests } = await db
    .from("friend_requests")
    .select("*")
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    );

  container.innerHTML = results.map(person => {
    const request = (requests || []).find(r =>
      (r.sender_id === currentUser.id && r.receiver_id === person.id) ||
      (r.receiver_id === currentUser.id && r.sender_id === person.id)
    );

    let action = `
      <button class="primary"
        onclick="sendFriendRequest('${person.id}')">Add Friend</button>`;

    if (request?.status === "accepted") {
      action = `<button class="secondary"
        onclick="openConversation('${person.id}')">Chat</button>`;
    } else if (request?.status === "pending") {
      action = `<button class="secondary" disabled>Request Pending</button>`;
    }

    return `
      <div class="person">
        ${avatarHTML(person)}
        <div class="person-info">
          <strong>${escapeHTML(displayName(person))}</strong>
        </div>
        ${action}
      </div>`;
  }).join("");
}

async function sendFriendRequest(friendId) {
  const { error } = await db.from("friend_requests").insert({
    sender_id: currentUser.id,
    receiver_id: friendId,
    status: "pending"
  });

  if (error) {
    alert("Could not send request: " + error.message);
    return;
  }

  alert("Friend request sent.");
  await searchFriends();
}

async function loadRequests() {
  const { data, error } = await db
    .from("friend_requests")
    .select("*")
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    );

  if (error) {
    el("incomingRequests").textContent = error.message;
    return;
  }

  const requests = data || [];

  const incoming = requests.filter(r =>
    r.receiver_id === currentUser.id && r.status === "pending"
  );

  const outgoing = requests.filter(r =>
    r.sender_id === currentUser.id && r.status === "pending"
  );

  const allIds = [...new Set(requests.map(r =>
    r.sender_id === currentUser.id ? r.receiver_id : r.sender_id
  ))];

  let profiles = [];

  if (allIds.length) {
    const result = await db.from("profiles").select("*").in("id", allIds);
    profiles = result.data || [];
  }

  const profileFor = id => profiles.find(p => p.id === id);

  el("incomingRequests").innerHTML = incoming.length
    ? incoming.map(r => {
        const person = profileFor(r.sender_id);

        return `
          <div class="person">
            ${avatarHTML(person)}
            <div class="person-info">
              <strong>${escapeHTML(displayName(person))}</strong>
            </div>
            <button class="primary"
              onclick="acceptRequest('${r.id}')">Accept</button>
            <button class="secondary"
              onclick="declineRequest('${r.id}')">Decline</button>
          </div>`;
      }).join("")
    : "<p>No incoming requests.</p>";

  el("outgoingRequests").innerHTML = outgoing.length
    ? outgoing.map(r => {
        const person = profileFor(r.receiver_id);

        return `
          <div class="person">
            ${avatarHTML(person)}
            <div class="person-info">
              <strong>${escapeHTML(displayName(person))}</strong>
              <span class="offline">Waiting for response</span>
            </div>
          </div>`;
      }).join("")
    : "<p>No pending sent requests.</p>";
}

async function acceptRequest(requestId) {
  const { error } = await db
    .from("friend_requests")
    .update({ status: "accepted" })
    .eq("id", requestId);

  if (error) {
    alert("Could not accept request: " + error.message);
    return;
  }

  await loadChatFriends();
  await loadRequests();
  await renderChatList();

  alert("Friend request accepted. Your new friend is now available in Chat.");
}

async function declineRequest(requestId) {
  const { error } = await db
    .from("friend_requests")
    .delete()
    .eq("id", requestId);

  if (error) {
    alert("Could not decline request: " + error.message);
    return;
  }

  await loadRequests();
}

/* ---------------------------------------------------
   CHAT LIST WITH LAST-MESSAGE PREVIEWS
--------------------------------------------------- */

async function getLastMessage(friendId) {
  const filter =
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),` +
    `and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`;

  let result = await db
    .from("messages")
    .select("*")
    .or(filter)
    .order("created_at", { ascending: false })
    .limit(1);

  if (result.error) {
    return null;
  }

  return result.data?.[0] || null;
}

function messagePreview(message) {
  if (!message) return "No messages yet. Tap to chat.";

  let text = message.content || "";

  if (message.media_path) {
    if (/\.(mp4|mov|webm|m4v)$/i.test(message.media_path)) {
      text = "🎥 Video";
    } else if (!text) {
      text = "📷 Photo";
    }
  }

  if (!text) text = "📎 Attachment";

  if (message.sender_id === currentUser.id) {
    text = "You: " + text;
  }

  return text;
}

async function renderChatList() {
  if (!currentUser) return;

  const container = el("chatList");
  const query = (el("chatSearch").value || "").toLowerCase();

  if (!chatFriends.length) {
    container.innerHTML = `
      <p>You don't have any friends yet.</p>
      <button class="primary" onclick="openFindFriends()">
        Find Friends
      </button>`;
    return;
  }

  container.innerHTML = "<p>Loading chats...</p>";

  const rows = await Promise.all(chatFriends.map(async friend => {
    const last = await getLastMessage(friend.id);

    return {
      friend,
      last,
      time: last?.created_at || ""
    };
  }));

  rows.sort((a, b) =>
    new Date(b.time || 0) - new Date(a.time || 0)
  );

  const filtered = rows.filter(row =>
    displayName(row.friend).toLowerCase().includes(query)
  );

  if (!filtered.length) {
    container.innerHTML = "<p>No matching chats found.</p>";
    return;
  }

  container.innerHTML = filtered.map(row => {
    const friend = row.friend;
    const last = row.last;
    const online = knownOnlineUsers.has(friend.id);

    return `
      <div class="chat-row" onclick="openConversation('${friend.id}')">
        ${avatarHTML(friend)}
        <div class="chat-info">
          <strong>${escapeHTML(displayName(friend))}</strong>
          <div class="preview">${escapeHTML(messagePreview(last))}</div>
          <div class="${online ? "online" : "offline"}">
            ${online ? "● Online" : "○ Offline"}
          </div>
        </div>
        <div class="time">${escapeHTML(formatTime(last?.created_at))}</div>
      </div>`;
  }).join("");
}

async function refreshChatList() {
  setStatus("Refreshing chats...");
  await loadChatFriends();
  await renderChatList();
  setStatus("Chats updated.");
}

/* ---------------------------------------------------
   OPEN AND LOAD A CONVERSATION
--------------------------------------------------- */

async function openConversation(friendId) {
  const friend = chatFriends.find(p => p.id === friendId);

  if (!friend) {
    await loadChatFriends();
  }

  activeFriend = chatFriends.find(p => p.id === friendId);

  if (!activeFriend) {
    alert("This person is not in your accepted friends list.");
    return;
  }

  el("chatListView").classList.add("hidden");
  el("conversationView").classList.remove("hidden");

  el("conversationName").textContent = displayName(activeFriend);

  updateConversationStatus();

  await loadMessages();
}

function updateConversationStatus() {
  if (!activeFriend) return;

  el("conversationStatus").textContent =
    knownOnlineUsers.has(activeFriend.id) ? "● Online" : "○ Offline";

  el("conversationStatus").className =
    knownOnlineUsers.has(activeFriend.id) ? "online" : "offline";
}

async function loadMessages() {
  if (!activeFriend) return;

  const filter =
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeFriend.id}),` +
    `and(sender_id.eq.${activeFriend.id},receiver_id.eq.${currentUser.id})`;

  const { data, error } = await db
    .from("messages")
    .select("*")
    .or(filter)
    .order("created_at", { ascending: true });

  if (error) {
    setStatus("Could not load messages: " + error.message);
    return;
  }

  const box = el("messages");
  box.innerHTML = "";

  renderedMessages.clear();

  for (const message of (data || [])) {
    await renderMessage(message);
  }

  box.scrollTop = box.scrollHeight;
}

async function getMediaURL(path) {
  if (!path) return null;

  if (/^https?:\/\//i.test(path)) {
    return path;
  }

  const { data } = db.storage
    .from("chat-media")
    .getPublicUrl(path);

  return data?.publicUrl || null;
}

async function renderMessage(message) {
  const box = el("messages");

  if (message.id && renderedMessages.has(message.id)) return;

  if (message.id) renderedMessages.add(message.id);

  const mine = message.sender_id === currentUser.id;
  const item = document.createElement("div");

  item.className = "message" + (mine ? " mine" : "");

  let content = "";

  if (message.media_path) {
    const url = await getMediaURL(message.media_path);

    if (url) {
      if (/\.(mp4|mov|webm|m4v)$/i.test(message.media_path)) {
        content += `
          <video controls preload="metadata" src="${escapeHTML(url)}"></video>`;
      } else {
        content += `
          <a href="${escapeHTML(url)}" target="_blank" rel="noopener">
            <img src="${escapeHTML(url)}" alt="Shared image">
          </a>`;
      }

      content += `
        <a href="${escapeHTML(url)}" target="_blank"
           rel="noopener" download>Download media</a>`;
    }
  }

  if (message.content) {
    content += `<div>${escapeHTML(message.content)}</div>`;
  }

  content += `<small>${escapeHTML(formatTime(message.created_at))}</small>`;

  item.innerHTML = content;
  box.appendChild(item);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  if (!activeFriend) {
    alert("Open a conversation first.");
    return;
  }

  const content = el("messageInput").value.trim();

  if (!content) return;

  el("messageInput").value = "";

  const { error } = await db.from("messages").insert({
    sender_id: currentUser.id,
    receiver_id: activeFriend.id,
    content
  });

  if (error) {
    el("messageInput").value = content;
    alert("Message failed: " + error.message);
    return;
  }

  await loadMessages();
  await renderChatList();
}

/* ---------------------------------------------------
   PICTURE AND VIDEO SHARING
--------------------------------------------------- */

async function sendMedia() {
  if (!activeFriend) {
    alert("Open a conversation first.");
    return;
  }

  const file = el("mediaInput").files[0];

  if (!file) {
    alert("Choose a picture or video first.");
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    alert("Please choose a file smaller than 50 MB.");
    return;
  }

  setStatus("Uploading media...");

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path =
    currentUser.id + "/" + Date.now() + "_" + safeName;

  const { error: uploadError } = await db.storage
    .from("chat-media")
    .upload(path, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (uploadError) {
    setStatus("Upload failed: " + uploadError.message);
    return;
  }

  const { error: messageError } = await db.from("messages").insert({
    sender_id: currentUser.id,
    receiver_id: activeFriend.id,
    content: "",
    media_path: path
  });

  if (messageError) {
    setStatus(
      "File uploaded, but message could not be saved: " +
      messageError.message
    );
    return;
  }

  el("mediaInput").value = "";
  setStatus("Media sent.");

  await loadMessages();
  await renderChatList();
}

/* ---------------------------------------------------
   REALTIME MESSAGES
--------------------------------------------------- */

function subscribeToMessages() {
  if (messageChannel) {
    db.removeChannel(messageChannel);
  }

  messageChannel = db
    .channel("jfriends-messages-" + currentUser.id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      async payload => {
        const message = payload.new;

        const relevant =
          message.sender_id === currentUser.id ||
          message.receiver_id === currentUser.id;

        if (!relevant) return;

        if (
          activeFriend &&
          (
            (message.sender_id === activeFriend.id &&
             message.receiver_id === currentUser.id) ||
            (message.sender_id === currentUser.id &&
             message.receiver_id === activeFriend.id)
          )
        ) {
          await renderMessage(message);
        }

        await loadChatFriends();

        if (!activeFriend) {
          await renderChatList();
        } else {
          // Keep last-message previews fresh while a conversation is open.
          await renderChatList();
        }
      }
    )
    .subscribe();
}

/* ---------------------------------------------------
   ONLINE PRESENCE
--------------------------------------------------- */

async function startPresence() {
  if (!currentUser) return;

  if (presenceChannel) {
    await db.removeChannel(presenceChannel);
    presenceChannel = null;
  }

  presenceChannel = db.channel("jfriends-presence", {
    config: {
      presence: { key: currentUser.id }
    }
  });

  presenceChannel
    .on("presence", { event: "sync" }, () => {
      const state = presenceChannel.presenceState();

      knownOnlineUsers = new Set(Object.keys(state));

      updateConversationStatus();

      if (!el("friendsPanel").classList.contains("hidden")) {
        loadFriendsList();
      }

      if (!activeFriend) {
        renderChatList();
      }
    })
    .subscribe(async status => {
      if (status === "SUBSCRIBED") {
        await presenceChannel.track({
          user_id: currentUser.id,
          online_at: new Date().toISOString()
        });
      }
    });
}

async function stopPresence() {
  if (presenceChannel) {
    await db.removeChannel(presenceChannel);
    presenceChannel = null;
  }
}

async function loadPresence() {
  // Presence shows online users connected to this same presence channel.
  updateConversationStatus();
}

/* ---------------------------------------------------
   RESTORE SESSION ON PAGE RELOAD
--------------------------------------------------- */

db.auth.getSession().then(async ({ data, error }) => {
  if (error) {
    showAuthStatus(error.message);
    return;
  }

  if (data.session?.user) {
    await startApp(data.session.user);
  }
});

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    currentProfile = null;
  }
});
</script>
