<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JFriendsChat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}header{background:#075e54;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}header h2{margin:0;font-size:21px}button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-size:14px}.primary{background:#087f68;color:white}.secondary{background:#e2e8e6;color:#222}.danger{background:#c62828;color:white}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0;font:inherit}textarea{min-height:75px;resize:vertical}.container{max-width:760px;margin:auto;padding:12px}.card,.post{background:white;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 4px #00000012}.hidden{display:none!important}nav{display:flex;gap:7px;padding:9px;background:white;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px #0002}nav button{flex:1;background:#e6efec;color:#075e54;font-weight:bold}nav button.active{background:#075e54;color:white}.submenu{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.submenu button{flex:1;min-width:100px}.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #eee}.avatar{width:44px;height:44px;border-radius:50%;background:#d9eee8;color:#075e54;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden}.flexinfo{flex:1;min-width:0}.muted{font-size:13px;color:#69736f}.chat-list-row{display:flex;align-items:center;gap:12px;padding:13px 3px;border-bottom:1px solid #edf0f0;min-height:82px;cursor:pointer;background:#fff}.chat-list-main{flex:1;min-width:0}.chat-list-top,.chat-list-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px}.chat-list-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-list-time{font-size:12px;color:#008f66;white-space:nowrap}.chat-list-preview{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.online{color:#128c45;font-size:12px}#messages{height:42vh;min-height:220px;overflow-y:auto;padding:10px;background:#e8e4dc;border-radius:10px;display:flex;flex-direction:column;gap:8px}.message{max-width:82%;padding:10px;background:white;border-radius:12px;align-self:flex-start}.message.mine{background:#d5f5cb;align-self:flex-end}.message img,.message video,.post-media{max-width:100%;width:100%;border-radius:9px;display:block;margin:7px 0}.message small{display:block;text-align:right;font-size:10px;color:#65716b;margin-top:5px}.composer{display:flex;gap:7px;align-items:center;margin-top:8px}.composer input{margin:0}.post-head{display:flex;align-items:center;gap:9px}.post-body{white-space:pre-wrap;margin:12px 0}.post-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.post-actions button{background:#eef3f1}.post-actions button.liked{background:#d5f5cb;color:#075e54}.comment{padding:8px;background:#f5f6f6;border-radius:8px;margin:6px 0}#status,#authStatus{font-size:13px;color:#075e54;margin:8px 0}footer{text-align:center;padding:18px;color:#777;font-size:12px}</style></head>
<body><header><h2>💬 JFriendsChat</h2><button id="accountButton" class="secondary hidden" onclick="toggleAccount()">👤 Account</button></header>
<div class="container"><section id="authPanel" class="card"><h3>Welcome</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="username" placeholder="Username (new accounts)"><button class="primary" onclick="signIn()">Log In</button> <button class="secondary" onclick="signUp()">Create Account</button><div id="authStatus"></div></section>
<section id="appPanel" class="hidden"><nav><button id="chatNav" class="active" onclick="openChatHome()">💬 Chat</button><button id="friendsNav" onclick="openFriendsMenu()">👥 Friends</button><button id="postsNav" onclick="openPosts()">📰 Posts</button></nav><div id="status"></div>
<section id="chatPanel" class="card"><h3 id="chatHeading">Your Chats</h3><div id="chatListView"><input id="chatSearch" placeholder="Search chats..." oninput="renderChatList()"><button class="secondary" onclick="refreshChatList()">🔄 Refresh</button><div id="chatList"></div></div><div id="conversationView" class="hidden"><button class="secondary" onclick="backToChatList()">← Back</button><h3 id="conversationName">Conversation</h3><div id="conversationStatus" class="muted"></div><div id="messages"></div><div class="composer"><input id="messageInput" placeholder="Type..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="primary" onclick="sendMessage()">Send</button></div><div class="composer"><input type="file" id="chatMediaInput" accept="image/*,video/*"><button class="secondary" onclick="sendChatMedia()">📎 Media</button></div></div></section>
<section id="friendsMenuPanel" class="card hidden"><h3>Friends</h3><div class="submenu"><button class="primary" onclick="openFriendsList()">My Friends</button><button class="primary" onclick="openRequests()">Requests</button><button class="primary" onclick="openFindFriends()">Find Friends</button></div></section>
<section id="friendsPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Friends</button><h3>My Friends</h3><div id="friendsList"></div></section>
<section id="requestsPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Friends</button><h3>Requests</h3><h4>Incoming</h4><div id="incomingRequests"></div><h4>Sent</h4><div id="outgoingRequests"></div></section>
<section id="searchPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Friends</button><h3>Find Friends</h3><input id="friendSearch" placeholder="Search..." oninput="searchFriends()"><div id="searchResults"></div></section>
<section id="postsPanel" class="hidden"><div class="card"><h3>Create post</h3><textarea id="postText" placeholder="What's on your mind?"></textarea><input id="postMedia" type="file" accept="image/*,video/*"><select id="postVisibility"><option value="public">🌍 Public</option><option value="private">🔒 Private</option></select><button class="primary" onclick="createPost()">Publish</button></div><div class="card"><h3>Posts feed</h3><button class="secondary" onclick="loadPosts()">🔄 Refresh</button><div id="postsFeed"></div></div></section>
<section id="accountPanel" class="card hidden"><h3>My Account</h3><div id="accountDetails"></div><input id="newUsername" placeholder="New username"><button class="primary" onclick="updateUsername()">Save</button> <button class="danger" onclick="signOut()">Log Out</button></section>
</section></div>
<script>
const SUPABASE_URL="https://msifvhqvxfjjwcazacxj.supabase.co";const SUPABASE_KEY="sb_publishable__uU2wBTvE8tWoAFoRSWVEA_AgJvZOqg";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const POST_BUCKET="social-posts";const CHAT_BUCKET="chat-media";let currentUser=null,currentProfile=null,chatFriends=[],activeFriend=null,messageChannel=null,presenceChannel=null,knownOnlineUsers=new Set(),renderedMessages=new Set();const el=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}function setStatus(t){el("status").textContent=t||""}function showAuthStatus(t){el("authStatus").textContent=t||""}function nameOf(p){return p?.username||"Friend"}function initials(n){return (n||"F").trim().charAt(0).toUpperCase()}function avatar(p){let photo=p?.avatar_url;if(photo) return `<div class="avatar"><img src="${esc(photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;return `<div class="avatar">${esc(initials(nameOf(p)))}</div>`;}function timeOf(v){if(!v)return "";let d=new Date(v);return d.toLocaleString();}function hidePanels(){["chatPanel","friendsMenuPanel","friendsPanel","requestsPanel","searchPanel","postsPanel","accountPanel"].forEach(id=>el(id).classList.add("hidden"))}function setNav(which){["chatNav","friendsNav","postsNav"].forEach(id=>el(id).classList.toggle("active",id===which))}
async function signUp(){let e=el("email").value.trim(),p=el("password").value,u=el("username").value.trim();if(!e||!p||!u)return showAuthStatus("Enter all");let {data,error}=await db.auth.signUp({email:e,password:p,options:{data:{username:u}}});if(error)return showAuthStatus(error.message);if(data.session)await startApp(data.user);else showAuthStatus("Created - log in");}
async function signIn(){let e=el("email").value.trim(),p=el("password").value;let {data,error}=await db.auth.signInWithPassword({email:e,password:p});if(error)return showAuthStatus(error.message);await startApp(data.user);}
async function signOut(){await db.auth.signOut();location.reload();}
async function startApp(user){currentUser=user;el("authPanel").classList.add("hidden");el("appPanel").classList.remove("hidden");el("accountButton").classList.remove("hidden");await ensureProfile();await loadChatFriends();openChatHome();subscribeToMessages();startPresence();}
async function ensureProfile(){let {data}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(data){currentProfile=data;return;}let username=currentUser.user_metadata?.username||currentUser.email.split("@")[0];let r=await db.from("profiles").insert({id:currentUser.id,username}).select().single();currentProfile=r.data;}
function toggleAccount(){hidePanels();el("accountPanel").classList.remove("hidden");el("accountDetails").textContent="Email: "+currentUser?.email+" | Username: "+nameOf(currentProfile);}
async function updateUsername(){let username=el("newUsername").value.trim();if(!username)return alert("Enter");let {data,error}=await db.from("profiles").update({username}).eq("id",currentUser.id).select().single();if(error)return alert(error.message);currentProfile=data;alert("Updated");}
async function openChatHome(){hidePanels();setNav("chat");el("chatPanel").classList.remove("hidden");el("chatListView").classList.remove("hidden");el("conversationView").classList.add("hidden");activeFriend=null;await loadChatFriends();await renderChatList();}
function openFriendsMenu(){hidePanels();setNav("friends");el("friendsMenuPanel").classList.remove("hidden");}
async function openPosts(){hidePanels();setNav("postsNav");el("postsPanel").classList.remove("hidden");await loadPosts();}
function backToChatList(){activeFriend=null;el("conversationView").classList.add("hidden");el("chatListView").classList.remove("hidden");renderChatList();}
async function openFriendsList(){hidePanels();setNav("friends");el("friendsPanel").classList.remove("hidden");await loadFriendsList();}
async function openRequests(){hidePanels();setNav("friends");el("requestsPanel").classList.remove("hidden");await loadRequests();}
async function openFindFriends(){hidePanels();setNav("friends");el("searchPanel").classList.remove("hidden");await searchFriends();}
async function loadChatFriends(){if(!currentUser)return;let {data}=await db.from("friend_requests").select("*").eq("status","accepted").or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);let ids=[...new Set((data||[]).map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id))].filter(id=>id!==currentUser.id);if(!ids.length){chatFriends=[];return;}let p=await db.from("profiles").select("*").in("id",ids);chatFriends=p.data||[];}
async function loadFriendsList(){await loadChatFriends();el("friendsList").innerHTML=chatFriends.length?chatFriends.map(p=>`<div class="row">${avatar(p)}<div class="flexinfo"><strong>${esc(nameOf(p))}</strong></div><button class="primary" onclick="openConversation('${p.id}')">Chat</button></div>`).join(""):"<p>No friends yet.</p>";}
async function searchFriends(){let q=el("friendSearch").value.trim(),box=el("searchResults");if(q.length<2){box.innerHTML="<p>Type 2 letters.</p>";return;}box.textContent="Searching...";let {data}=await db.from("profiles").select("*").ilike("username","%"+q+"%").limit(20);let people=(data||[]).filter(p=>p.id!==currentUser.id);if(!people.length){box.innerHTML="<p>No users found.</p>";return;}let req=await db.from("friend_requests").select("*").or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);box.innerHTML=people.map(p=>{let r=(req.data||[]).find(x=>(x.sender_id===currentUser.id&&x.receiver_id===p.id)||(x.receiver_id===currentUser.id&&x.sender_id===p.id));let b=r?.status==="accepted"?`<button class="secondary" onclick="openConversation('${p.id}')">Chat</button>`:r?.status==="pending"?`<button disabled>Pending</button>`:`<button class="primary" onclick="sendFriendRequest('${p.id}')">Add</button>`;return `<div class="row">${avatar(p)}<div class="flexinfo"><strong>${esc(nameOf(p))}</strong></div>${b}</div>`}).join("");}
async function sendFriendRequest(id){let {error}=await db.from("friend_requests").insert({sender_id:currentUser.id,receiver_id:id,status:"pending"});if(error)return alert(error.message);alert("Request sent");await searchFriends();}
async function loadRequests(){let {data}=await db.from("friend_requests").select("*").or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);let rs=data||[],inc=rs.filter(r=>r.receiver_id===currentUser.id&&r.status==="pending"),out=rs.filter(r=>r.sender_id===currentUser.id&&r.status==="pending"),ids=[...new Set(rs.map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id))],pr=[];if(ids.length){let p=await db.from("profiles").select("*").in("id",ids);pr=p.data||[];}let find=id=>pr.find(p=>p.id===id);el("incomingRequests").innerHTML=inc.length?inc.map(r=>`<div class="row">${avatar(find(r.sender_id))}<div class="flexinfo"><strong>${esc(nameOf(find(r.sender_id)))}</strong></div><button class="primary" onclick="acceptRequest('${r.id}')">Accept</button><button class="secondary" onclick="declineRequest('${r.id}')">Decline</button></div>`).join(""):"<p>No incoming.</p>";el("outgoingRequests").innerHTML=out.length?out.map(r=>`<div class="row"><div class="flexinfo">${esc(nameOf(find(r.receiver_id)))}</div>Pending</div>`).join(""):"<p>No sent.</p>";}
async function acceptRequest(id){await db.from("friend_requests").update({status:"accepted"}).eq("id",id);await loadChatFriends();await loadRequests();alert("Accepted");}
async function declineRequest(id){await db.from("friend_requests").delete().eq("id",id);await loadRequests();}
async function lastMessage(friendId){let filter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`;let {data}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:false}).limit(1);return data?.[0]||null;}
function preview(m){if(!m)return "Tap to chat";let t=m.content||"";if(m.media_path&&!t)t="📎 Media";if(m.sender_id===currentUser.id)t="You: "+t;return t;}
async function renderChatList(){if(!currentUser)return;let box=el("chatList"),q=(el("chatSearch").value||"").toLowerCase();if(!chatFriends.length){box.innerHTML='<p>No friends yet.</p>';return;}box.innerHTML="<p>Loading...</p>";let rows=await Promise.all(chatFriends.map(async f=>({f,m:await lastMessage(f.id)})));rows.sort((a,b)=>new Date(b.m?.created_at||0)-new Date(a.m?.created_at||0));rows=rows.filter(r=>nameOf(r.f).toLowerCase().includes(q));box.innerHTML=rows.map(({f,m})=>`<div class="chat-list-row" onclick="openConversation('${f.id}')">${avatar(f)}<div class="chat-list-main"><div class="chat-list-top"><div class="chat-list-name">${esc(nameOf(f))}</div><span class="chat-list-time">${esc(timeOf(m?.created_at))}</span></div><div class="chat-list-bottom"><div class="chat-list-preview">${esc(m?preview(m):"Tap to chat")}</div></div></div></div>`).join("");}
async function refreshChatList(){await loadChatFriends();await renderChatList();}
async function openConversation(id){await loadChatFriends();activeFriend=chatFriends.find(p=>p.id===id);if(!activeFriend)return alert("Not a friend");el("chatListView").classList.add("hidden");el("conversationView").classList.remove("hidden");el("conversationName").textContent=nameOf(activeFriend);await loadMessages();}
function mediaURL(path,bucket){if(!path)return null;let res=db.storage.from(bucket||POST_BUCKET).getPublicUrl(path);return res.data?.publicUrl||null;}
async function loadMessages(){if(!activeFriend)return;let filter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},receiver_id.eq.${currentUser.id})`;let {data}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:true});el("messages").innerHTML="";renderedMessages.clear();for(let m of data||[])await renderMessage(m);el("messages").scrollTop=el("messages").scrollHeight;}
async function renderMessage(m){if(m.id&&renderedMessages.has(m.id))return;if(m.id)renderedMessages.add(m.id);let item=document.createElement("div");item.className="message"+(m.sender_id===currentUser.id?" mine":"");let c="";if(m.media_path){let url=mediaURL(m.media_path,CHAT_BUCKET);if(url)c+=/\\.(mp4|mov|webm)$/i.test(m.media_path)?`<video controls src="${esc(url)}"></video>`:`<img src="${esc(url)}" onclick="shareImage('${esc(url)}')">`;}if(m.content)c+=`<div>${esc(m.content)}</div>`;c+=`<small>${esc(timeOf(m.created_at))}</small>`;item.innerHTML=c;el("messages").appendChild(item);}
async function sendMessage(){if(!activeFriend)return;let content=el("messageInput").value.trim();if(!content)return;await db.from("messages").insert({sender_id:currentUser.id,receiver_id:activeFriend.id,content});el("messageInput").value="";await loadMessages();await renderChatList();}
async function sendChatMedia(){if(!activeFriend)return;let file=el("chatMediaInput").files[0];if(!file)return alert("Choose file");let path=currentUser.id+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");let {error}=await db.storage.from(CHAT_BUCKET).upload(path,file);if(error)return alert(error.message);await db.from("messages").insert({sender_id:currentUser.id,receiver_id:activeFriend.id,content:"",media_path:path});el("chatMediaInput").value="";await loadMessages();await renderChatList();}
function subscribeToMessages(){if(messageChannel)db.removeChannel(messageChannel);messageChannel=db.channel("msgs-"+currentUser.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async p=>{let m=p.new;if(m.sender_id!==currentUser.id&&m.receiver_id!==currentUser.id)return;if(activeFriend&&((m.sender_id===activeFriend.id&&m.receiver_id===currentUser.id)||(m.sender_id===currentUser.id&&m.receiver_id===activeFriend.id)))await renderMessage(m);await renderChatList();}).subscribe();}
async function startPresence(){presenceChannel=db.channel("presence",{config:{presence:{key:currentUser.id}}});presenceChannel.on("presence",{event:"sync"},()=>{knownOnlineUsers=new Set(Object.keys(presenceChannel.presenceState()));if(!activeFriend)renderChatList();}).subscribe(async s=>{if(s==="SUBSCRIBED")await presenceChannel.track({online_at:new Date().toISOString()});});}
async function createPost(){let text=el("postText").value.trim(),file=el("postMedia").files[0],visibility=el("postVisibility").value;if(!text&&!file)return alert("Write something");setStatus("Publishing...");let postId=crypto.randomUUID(),path=null;if(file){path=currentUser.id+"/"+postId+"/"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");let {error}=await db.storage.from(POST_BUCKET).upload(path,file);if(error){setStatus("Upload failed: "+error.message);return;}}
let {error}=await db.from("posts").insert({id:postId,user_id:currentUser.id,content:text,media_path:path,media_type:file?(file.type.startsWith("video/")?"video":"image"):null,visibility});if(error){setStatus(error.message);return;}el("postText").value="";el("postMedia").value="";setStatus("Published");await loadPosts();}
async function loadPosts(){let box=el("postsFeed");box.innerHTML="<p>Loading...</p>";let {data:posts,error}=await db.from("posts").select("*").order("created_at",{ascending:false}).limit(100);if(error){box.innerHTML=error.message;return;}posts=posts||[];if(!posts.length){box.innerHTML="<p>No posts yet.</p>";return;}let ids=[...new Set(posts.map(p=>p.user_id))],profiles=[];if(ids.length){let r=await db.from("profiles").select("*").in("id",ids);profiles=r.data||[];}let {data:likes}=await db.from("post_likes").select("*").in("post_id",posts.map(p=>p.id));let {data:comments}=await db.from("post_comments").select("*").in("post_id",posts.map(p=>p.id));let html=[];for(let p of posts){if(p.visibility==="private"&&p.user_id!==currentUser.id)continue;let author=profiles.find(x=>x.id===p.user_id);let media="";if(p.media_path){let url=mediaURL(p.media_path,POST_BUCKET);if(url){media=p.media_type==="video"?`<video class="post-media" controls src="${esc(url)}"></video>`:`<img class="post-media" src="${esc(url)}" onclick="shareImage('${esc(url)}')" style="cursor:pointer">`;media+=`<div class="post-actions"><a href="${esc(url)}" target="_blank" download><button class="secondary">⬇️ Download</button></a><button class="secondary" onclick="shareImage('${esc(url)}')">↗️ Share Image</button></div>`;}}
let pl=(likes||[]).filter(l=>l.post_id===p.id),pc=(comments||[]).filter(c=>c.post_id===p.id),liked=pl.some(l=>l.user_id===currentUser.id);
html.push(`<article class="post"><div class="post-head">${avatar(author)}<div class="flexinfo"><strong>${esc(nameOf(author))}</strong><div class="muted">${esc(timeOf(p.created_at))} · ${p.visibility}</div></div>${p.user_id===currentUser.id?`<button class="secondary" onclick="deletePost('${p.id}')">Delete</button>`:""}</div>${p.content?`<div class="post-body">${esc(p.content)}</div>`:""}${media}<div class="post-actions"><button class="${liked?"liked":""}" onclick="toggleLike('${p.id}',${liked})">❤️ ${liked?"Liked":"Like"} ${pl.length}</button><button onclick="focusComment('${p.id}')">💬 ${pc.length}</button></div><div id="comments-${p.id}">${pc.map(c=>`<div class="comment">${esc(c.content)}</div>`).join("")}</div><div class="composer"><input id="commentInput-${p.id}" placeholder="Comment..."><button class="primary" onclick="addComment('${p.id}')">Send</button></div></article>`);
}box.innerHTML=html.join("");}
async function toggleLike(postId,liked){if(liked)await db.from("post_likes").delete().eq("post_id",postId).eq("user_id",currentUser.id);else await db.from("post_likes").insert({post_id:postId,user_id:currentUser.id});await loadPosts();}
function focusComment(id){el("commentInput-"+id)?.focus();}
async function addComment(postId){let input=el("commentInput-"+postId),content=input.value.trim();if(!content)return;await db.from("post_comments").insert({post_id:postId,user_id:currentUser.id,content});input.value="";await loadPosts();}
async function deletePost(id){if(!confirm("Delete?"))return;await db.from("posts").delete().eq("id",id);await loadPosts();}
async function shareImage(url){try{let res=await fetch(url);let blob=await res.blob();let file=new File([blob],"image.jpg",{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"JFriendsChat"});return;}}catch(e){}window.open(url,"_blank");}
db.auth.getSession().then(async({data})=>{if(data.session?.user)await startApp(data.session.user);});
</script></body></html>
