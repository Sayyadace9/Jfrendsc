<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFriendsChat - Facebook + Business + OConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#075e54;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
header h2{margin:0;font-size:19px}button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px}.primary{background:#087f68;color:white}.secondary{background:#e6eef6;color:#222}.danger{background:#c62828;color:white}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0;font:inherit}textarea{min-height:70px;resize:vertical}
.container{max-width:820px;margin:auto;padding:8px}.card,.post{background:white;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0001}.hidden{display:none!important}
nav{display:flex;gap:4px;padding:7px;background:white;position:sticky;top:49px;z-index:15;box-shadow:0 1px 3px #0001;overflow-x:auto}nav button{flex:1;min-width:62px;background:#e6efec;color:#075e54;font-weight:bold;font-size:12px;padding:8px 4px}nav button.active{background:#075e54;color:white}
.stories-bar{display:flex;gap:12px;overflow-x:auto;padding:12px 8px;background:white;border-radius:12px;margin:10px 0;scrollbar-width:none;white-space:nowrap;box-shadow:0 1px 3px #0001}
.stories-bar::-webkit-scrollbar{display:none}.story-item{min-width:66px;text-align:center;cursor:pointer;flex-shrink:0}.story-circle{width:60px;height:60px;border-radius:50%;border:3px solid #1877f2;padding:2px;background:white;margin:auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.story-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover}.story-circle .avatar{width:100%;height:100%;border-radius:50%;background:#d9eee8;color:#075e54;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.story-circle.add{border-color:#ccc;border-style:dashed}.online-dot{width:12px;height:12px;background:#31a24c;border-radius:50%;border:2px solid white;position:absolute;bottom:1px;right:1px}.story-name{font-size:11px;margin-top:4px;width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee}.avatar{width:44px;height:44px;border-radius:50%;background:#d9eee8;color:#075e54;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;overflow:hidden}.flexinfo{flex:1;min-width:0}.muted{font-size:12px;color:#69736f}
.chat-list-row{display:flex;align-items:center;gap:10px;padding:11px 3px;border-bottom:1px solid #eee;min-height:70px;cursor:pointer;background:#fff}
#messages{height:36vh;min-height:200px;overflow-y:auto;padding:10px;background:#e8e4dc;border-radius:10px;display:flex;flex-direction:column;gap:7px}.message{max-width:82%;padding:9px;background:white;border-radius:12px;align-self:flex-start}.message.mine{background:#d5f5cb;align-self:flex-end}.message img,.message video,.post-media,.product-img{max-width:100%;width:100%;border-radius:9px;display:block;margin:6px 0}
.composer{display:flex;gap:6px;align-items:center;margin-top:7px}.composer input{margin:0}
.post-head{display:flex;align-items:center;gap:8px}.post-body{white-space:pre-wrap;margin:10px 0}.post-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.post-actions button{background:#eef3f1}.comment{padding:7px;background:#f5f6f6;border-radius:8px;margin:5px 0}
.shop-card{border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin:8px 0}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.product-card{border:1px solid #eee;border-radius:10px;overflow:hidden;background:white}.product-card img{height:130px;object-fit:cover}.product-info{padding:8px}.price{color:#087f68;font-weight:bold}
.meeting-card{border:2px solid #1877f2;border-radius:10px;padding:10px;margin:8px 0;background:#f0f7ff}
.group-item{padding:10px;border:1px solid #e0e0e0;border-radius:8px;margin:6px 0;cursor:pointer}
#jitsiFrame{width:100%;height:60vh;border:0;border-radius:10px;display:none}
</style>
</head>
<body>
<header><h2>💬 JFriendsChat</h2><div><button id="accountButton" class="secondary hidden" onclick="toggleAccount()">👤</button></div></header>
<div class="container">
<section id="authPanel" class="card"><h3>Welcome to JFriendsChat</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="username" placeholder="Username"><button class="primary" onclick="signIn()">Log In</button> <button class="secondary" onclick="signUp()">Create Account</button><div id="authStatus"></div></section>
<section id="appPanel" class="hidden">
<nav>
<button id="chatNav" class="active" onclick="openChatHome()">💬<br>Chat</button>
<button id="friendsNav" onclick="openFriendsMenu()">👥<br>Friends</button>
<button id="postsNav" onclick="openPosts()">📰<br>Feed</button>
<button id="groupsNav" onclick="openGroups()">👥<br>Groups</button>
<button id="marketNav" onclick="openMarket()">🏪<br>Market</button>
<button id="connectNav" onclick="openConnect()">📹<br>OConnect</button>
</nav>
<div id="status" class="muted"></div>
<div id="storiesBar" class="stories-bar hidden"></div>
<section id="chatPanel" class="card"><h3>Chats</h3><div id="chatListView"><input id="chatSearch" placeholder="Search..." oninput="renderChatList()"><button class="secondary" onclick="refreshChatList()">🔄 Refresh</button><div id="chatList"></div></div><div id="conversationView" class="hidden"><button class="secondary" onclick="backToChatList()">← Back</button><h3 id="conversationName">Chat</h3><div id="messages"></div><div class="composer"><input id="messageInput" placeholder="Type..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="primary" onclick="sendMessage()">Send</button></div><div class="composer"><input type="file" id="chatMediaInput" accept="image/*,video/*"><button class="secondary" onclick="sendChatMedia()">📎</button></div></div></section>
<section id="postsPanel" class="hidden"><div class="card"><h3>Create Post (Facebook style)</h3><textarea id="postText" placeholder="What's on your mind?"></textarea><input id="postMedia" type="file" accept="image/*,video/*"><select id="postVisibility"><option value="public">🌍 Public</option><option value="private">🔒 Private</option></select><button class="primary" onclick="createPost()">Publish</button></div><div class="card"><h3>Feed</h3><button class="secondary" onclick="loadPosts()">🔄 Refresh</button><div id="postsFeed"></div></div></section>
<section id="marketPanel" class="card hidden"><h3>🏪 JFriends Market - Business Center</h3><p class="muted">Create your shop, add products, location, and everyone will see and chat you to buy</p><div class="submenu"><button class="primary" onclick="showCreateShop()">+ Create Shop</button><button class="secondary" onclick="loadMyShops()">My Shops</button><button class="secondary" onclick="loadAllProducts()">All Products</button></div><div id="createShopForm" class="card hidden" style="border:2px dashed #087f68"><h4>Create Market Account</h4><input id="shopName" placeholder="Shop Name e.g. Alhaji Shoes Store"><textarea id="shopDesc" placeholder="What do you sell?"></textarea><input id="shopLocation" placeholder="Location e.g. Gogori, Jigawa - Shop No 12"><input id="shopPhone" placeholder="WhatsApp Number"><select id="shopCategory"><option>General</option><option>Fashion</option><option>Electronics</option><option>Food</option><option>Services</option><option>Building Materials</option></select><button class="primary
