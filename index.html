<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFriendsChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #222;
}

header {
  background: #075e54;
  color: white;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h2 {
  margin: 0;
  font-size: 21px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  cursor: pointer;
  font-size: 14px;
}

.primary {
  background: #087f68;
  color: white;
}

.secondary {
  background: #e2e8e6;
  color: #222;
}

.danger {
  background: #c62828;
  color: white;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 7px 0;
  font-size: 16px;
}

.container {
  max-width: 750px;
  margin: 0 auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
  box-shadow: 0 1px 4px #00000012;
}

.hidden {
  display: none !important;
}

nav {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 1px 4px #00000015;
}

nav button {
  flex: 1;
  background: #e6efec;
  color: #075e54;
  font-weight: bold;
}

nav button.active {
  background: #075e54;
  color: white;
}

.submenu {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.submenu button {
  flex: 1;
  min-width: 110px;
}

.person, .chat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 4px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.person:last-child, .chat-row:last-child {
  border-bottom: none;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #d9eee8;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #075e54;
  font-weight: bold;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.person-info, .chat-info {
  flex: 1;
  min-width: 0;
}

.person-info strong, .chat-info strong {
  display: block;
  margin-bottom: 5px;
}

.preview {
  color: #66716e;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.time {
  color: #66716e;
  font-size: 11px;
  white-space: nowrap;
}

.online {
  color: #128c45;
  font-size: 12px;
}

.offline {
  color: #777;
  font-size: 12px;
}

#messages {
  height: 50vh;
  min-height: 250px;
  overflow-y: auto;
  padding: 12px;
  background: #e8e4dc;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  max-width: 82%;
  padding: 10px 12px;
  border-radius: 12px;
  background: white;
  overflow-wrap: anywhere;
  align-self: flex-start;
}

.message.mine {
  background: #d5f5cb;
  align-self: flex-end;
}

.message img, .message video {
  max-width: 100%;
  border-radius: 8px;
  display: block;
  margin-bottom: 6px;
}

.message small {
  display: block;
  margin-top: 5px;
  color: #65716b;
  font-size: 10px;
  text-align: right;
}

.composer {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-top: 10px;
}

.composer input {
  margin: 0;
}

.composer button {
  flex-shrink: 0;
}

#status {
  font-size: 13px;
  margin: 8px 0;
  color: #075e54;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #777;
}

@media (max-width: 420px) {
  .container {
    padding: 9px;
  }

  .card {
    padding: 11px;
  }

  .composer button {
    padding: 10px;
  }
}
</style>
</head>

<body>

<header>
  <h2>💬 JFriendsChat</h2>
  <button id="accountButton" class="secondary hidden"
          onclick="toggleAccount()">👤 Account</button>
</header>

<div class="container">

  <section id="authPanel" class="card">
    <h3>Welcome to JFriendsChat</h3>
    <p>Log in or create an account to chat with friends.</p>

    <input id="email" type="email" placeholder="Email address"
           autocomplete="email">

    <input id="password" type="password" placeholder="Password"
           autocomplete="current-password">

    <input id="username" placeholder="Username (for new accounts)">

    <button class="primary" onclick="signIn()">Log In</button>
    <button class="secondary" onclick="signUp()">Create Account</button>

    <div id="authStatus"></div>
  </section>

  <section id="appPanel" class="hidden">

    <nav>
      <button id="chatNav" class="active" onclick="openChatHome()">
        💬 Chat
      </button>

      <button id="friendsNav" onclick="openFriendsMenu()">
        👥 Friends
      </button>
    </nav>

    <div id="status"></div>

    <section id="chatPanel" class="card">
      <h3 id="chatHeading">Your Chats</h3>

      <div id="chatListView">
        <input id="chatSearch" placeholder="Search chats..."
               oninput="renderChatList()">

        <button class="secondary" onclick="refreshChatList()">
          🔄 Refresh chats
        </button>

        <div id="chatList"></div>
      </div>

      <div id="conversationView" class="hidden">
        <button class="secondary" onclick="backToChatList()">
          ← Back to chats
        </button>

        <h3 id="conversationName">Conversation</h3>
        <div id="conversationStatus"></div>

        <div id="messages"></div>

        <div class="composer">
          <input id="messageInput" placeholder="Type a message..."
                 onkeydown="if(event.key==='Enter') sendMessage()">

          <button class="primary" onclick="sendMessage()">Send</button>
        </div>

        <div class="composer">
          <input type="file" id="mediaInput"
                 accept="image/*,video/*">

          <button class="secondary" onclick="sendMedia()">
            📎 Send media
          </button>
        </div>
      </div>
    </section>

    <section id="friendsMenuPanel" class="card hidden">
      <h3>Friends</h3>

      <div class="submenu">
        <button class="primary" onclick="openFriendsList()">
          👥 My Friends
        </button>

        <button class="primary" onclick="openRequests()">
          📨 Friend Requests
        </button>

        <button class="primary" onclick="openFindFriends()">
          🔍 Find Friends
        </button>
      </div>
    </section>

    <section id="friendsPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>My Friends</h3>
      <div id="friendsList"></div>
    </section>

    <section id="requestsPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>Friend Requests</h3>

      <h4>Incoming Requests</h4>
      <div id="incomingRequests"></div>

      <h4>Sent Requests</h4>
      <div id="outgoingRequests"></div>
    </section>

    <section id="searchPanel" class="card hidden">
      <button class="secondary" onclick="openFriendsMenu()">← Friends</button>
      <h3>Find Friends</h3>

      <input id="friendSearch" placeholder="Search by username..."
             oninput="searchFriends()">

      <div id="searchResults"></div>
    </section>

    <section id="accountPanel" class="card hidden">
      <h3>My Account</h3>
      <div id="accountDetails"></div>

      <input id="newUsername" placeholder="Change username">

      <button class="primary" onclick="updateUsername()">
        Save Username
      </button>

      <button class="danger" onclick="signOut()">Log Out</button>
    </section>

  </section>
</div>

<footer>JFriendsChat · Stay connected with your friends</footer>

<script>
/* ---------------------------------------------------
   SUPABASE CONFIGURATION
   Keep your own project's URL and publishable key.
--------------------------------------------------- */

const SUPABASE_URL =
  "https://msifvhqvxfjjwcazacxj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__uU2wBTvE8tWoAFoRSWVEA_AgJvZOqg";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let chatFriends = [];
let activeFriend = null;
let messageChannel = null;
let presenceChannel = null;
let knownOnlineUsers = new Set();
let renderedMessages = new Set();
let refreshTimer = null;

function el(id) {
  return document.getElementById(id);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function setStatus(message) {
  el("status").textContent = message || "";
}

function showAuthStatus(message) {
  el("authStatus").textContent = message || "";
}

function formatTime(dateValue) {
  if (!dateValue) return "";

  const date = new Date(dateValue);

  if (Number.isNaN(date.getTime())) return "";

  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();

  if (sameDay) {
    return date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  return date.toLocaleDateString([], {
    month: "short",
    day: "numeric"
  });
}

function displayName(profile) {
  return profile?.username ||
         profile?.display_name ||
         profile?.full_name ||
         "Friend";
}

function initials(name) {
  return (name || "F").trim().charAt(0).toUpperCase();
}

function avatarHTML(profile) {
  const name = displayName(profile);

  if (profile?.avatar_url) {
    return `<div class="avatar">
      <img src="${escapeHTML(profile.avatar_url)}" alt="">
    </div>`;
  }

  return `<div class="avatar">${escapeHTML(initials(name))}</div>`;
}

/* ---------------------------------------------------
   AUTHENTICATION
--------------------------------------------------- */

async function signUp() {
  const email = el("email").value.trim();
  const password = el("password").value;
  const username = el("username").value.trim();

  if (!email || !password || !username) {
    showAuthStatus("Enter your email, password and username.");
    return;
  }

  if (password.length < 6) {
    showAuthStatus("Your password must have at least 6 characters.");
    return;
  }

  showAuthStatus("Creating your account...");

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: { username }
    }
  });

  if (error) {
    showAuthStatus(error.message);
    return;
  }

  if (data.session) {
    await startApp(data.session.user);
  } else {
    showAuthStatus(
      "Account created. Check your email if confirmation is required, then log in."
    );
  }
}

async function signIn() {
  const email = el("email").value.trim();
  const password = el("password").value;

  if (!email || !password) {
    showAuthStatus("Enter your email and password.");
    return;
  }

  showAuthStatus("Logging in...");

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showAuthStatus(error.message);
    return;
  }

  await startApp(data.user);
}

async function signOut() {
  await stopPresence();

  if (messageChannel) {
    await db.removeChannel(messageChannel);
    messageChannel = null;
  }

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;
  activeFriend = null;

  el("appPanel").classList.add("hidden");
  el("authPanel").classList.remove("hidden");
  el("accountButton").classList.add("hidden");
  el("accountPanel").classList.add("hidden");

  showAuthStatus("You have logged out.");
}

async function startApp(user) {
  currentUser = user;

  el("authPanel").classList.add("hidden");
  el("appPanel").classList.remove("hidden");
  el("accountButton").classList.remove("hidden");

  await ensureProfile();
  await loadChatFriends();

  openChatHome();
  await renderChatList();
  await loadPresence();

  subscribeToMessages();
  await startPresence();

  if (refreshTimer) clearInterval(refreshTimer);

  refreshTimer = setInterval(async () => {
    if (!currentUser) return;

    await loadChatFriends();

    if (!activeFriend) {
      await renderChatList();
    } else {
      await loadPresence();
    }
  }, 15000);
}

/* ---------------------------------------------------
   PROFILE
--------------------------------------------------- */

async function ensureProfile() {
  const { data, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    setStatus("Could not load your profile: " + error.message);
    return;
  }

  if (data) {
    currentProfile = data;
    return;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const { data: created, error: insertError } = await db
    .from("profiles")
    .insert({
      id: currentUser.id,
      username
    })
    .select()
    .single();

  if (insertError) {
    setStatus(
      "Profile setup failed. Check your profiles table and its permissions: " +
      insertError.message
    );
    return;
  }

  currentProfile = created;
}

function toggleAccount() {
  hideAllPanels();

  el("accountPanel").classList.remove("hidden");
  el("accountDetails").textContent =
    "Email: " + (currentUser?.email || "") +
    " | Username: " + displayName(currentProfile);

  el("newUsername").value = displayName(currentProfile);
}

async function updateUsername() {
  const username = el("newUsername").value.trim();

  if (!username) {
    alert("Enter a username.");
    return;
  }

  const { data, error } = await db
    .from("profiles")
    .update({ username })
    .eq("id", currentUser.id)
    .select()
    .single();

  if (error) {
    alert("Could not update username: " + error.message);
    return;
  }

  currentProfile = data;
  el("accountDetails").textContent =
    "Email: " + currentUser.email +
    " | Username: " + displayName(currentProfile);

  alert("Username updated.");
}

/* ---------------------------------------------------
   NAVIGATION
--------------------------------------------------- */

function hideAllPanels() {
  [
    "chatPanel",
    "friendsMenuPanel",
    "friendsPanel",
    "requestsPanel",
    "searchPanel",
    "accountPanel"
  ].forEach(id => el(id).classList.add("hidden"));
}

function setNav(active) {
  el("chatNav").classList.toggle("active", active === "chat");
  el("friendsNav").classList.toggle("active", active === "friends");
}

async function openChatHome() {
  hideAllPanels();
  setNav("chat");

  el("chatPanel").classList.remove("hidden");
  el("chatListView").classList.remove("hidden");
  el("conversationView").classList.add("hidden");
  el("chatHeading").textContent = "Your Chats";

  activeFriend = null;

  await loadChatFriends();
  await renderChatList();
}

function openFriendsMenu() {
  hideAllPanels();
  setNav("friends");
  el("friendsMenuPanel").classList.remove("hidden");
}

function backToChatList() {
  activeFriend = null;
  el("conversationView").classList.add("hidden");
  el("chatListView").classList.remove("hidden");
  el("chatHeading").textContent = "Your Chats";
  renderChatList();
}

async function openFriendsList() {
  hideAllPanels();
  setNav("friends");
  el("friendsPanel").classList.remove("hidden");
  await loadFriendsList();
}

async function openRequests() {
  hideAllPanels();
  setNav("friends");
  el("requestsPanel").classList.remove("hidden");
  await loadRequests();
}

async function openFindFriends() {
  hideAllPanels();
  setNav("friends");
  el("searchPanel").classList.remove("hidden");
  await searchFriends();
}

/* ---------------------------------------------------
   FRIENDS
--------------------------------------------------- */

async function loadChatFriends() {
  if (!currentUser
