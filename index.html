<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFriendsChat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#075e54;color:white;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#087f68;color:white}.secondary{background:#e6eef6}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0}nav{display:flex;gap:4px;padding:7px;background:white;position:sticky;top:49px}nav button{flex:1;background:#e6efec;color:#075e54;font-weight:bold}nav button.active{background:#075e54;color:white}.card{background:white;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}.hidden{display:none!important}.avatar{width:44px;height:44px;border-radius:50%;background:#d9eee8;display:flex;align-items:center;justify-content:center;font-weight:bold}.row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}#messages{height:35vh;overflow-y:auto;padding:10px;background:#e8e4dc;border-radius:10px;display:flex;flex-direction:column;gap:6px}.message{max-width:82%;padding:9px;background:white;border-radius:10px}.message.mine{background:#d5f5cb;align-self:flex-end}.muted{font-size:12px;color:#666}</style></head><body><header><h2>💬 JFriendsChat</h2><button id="accountBtn" class="secondary hidden" onclick="toggleAccount()">👤</button></header><div style="max-width:800px;margin:auto;padding:8px">
<section id="authPanel" class="card" style="max-width:380px;margin:40px auto"><h3>Log in</h3><input id="email" type="text" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="signIn()" style="width:100%">Log in</button><button class="secondary" onclick="signUp()" style="width:100%;margin-top:8px">Create new account</button><div id="authStatus" style="color:red;text-align:center;margin-top:8px"></div></section>
<section id="appPanel" class="hidden"><nav><button id="chatNav" class="active" onclick="openChat()">💬 Chat</button><button id="friendsNav" onclick="openFriends()">🔍 Friends</button><button onclick="signOut()" style="background:#c62828;color:white">Logout</button></nav><div id="chatView"><input id="chatSearch" placeholder="Search..." oninput="renderList()"><div id="chatList"></div></div><div id="convView" class="hidden"><button class="secondary" onclick="backList()">← Back</button><h3 id="convName"></h3><div id="messages"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="msgInput" placeholder="Type a message..."><button class="primary" onclick="sendMsg()">Send</button></div></div><div id="friendsView" class="card hidden"><input id="friendSearch" placeholder="Search users..." oninput="searchFriends()"><div id="searchResults"></div><h4>My Friends</h4><div id="friendsList"></div><h4>Requests</h4><div id="requestsList"></div></div><div id="accountView" class="card hidden"><h3>Account</h3><div id="accountDetails"></div><input id="newUsername" placeholder="New username"><button class="primary" onclick="updateName()">Save username</button></div></section></div>
<script>
const URL="https://msifvhqvxfjjwcazacxj.supabase.co";const KEY="sb_publishable__uU2wBTvE8tWoAFoRSWVEA_AgJvZOqg";const db=window.supabase.createClient(URL,KEY);let user=null,profile=null,friends=[],active=null;const el=id=>document.getElementById(id);function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function showStatus(t){el("authStatus").textContent=t||"";}
async function signUp(){let e=el("email").value.trim(),p=el("password").value;if(!e||!p)return showStatus("Enter email and password");showStatus("Creating...");let {data,error}=await db.auth.signUp({email:e,password:p});if(error){showStatus(error.message);return;}showStatus("✅ Account created! Now click Log in");}
async function signIn(){let e=el("email").value.trim(),p=el("password").value;if(!e||!p)return showStatus("Enter email and password");showStatus("Logging in...");let {data,error}=await db.auth.signInWithPassword({email:e,password:p});if(error){showStatus(error.message);return;}showStatus("");startApp(data.user);}
async function signOut(){await db.auth.signOut();location.reload();}
async function startApp(u){user=u;el("authPanel").classList.add("hidden");el("appPanel").classList.remove("hidden");el("accountBtn").classList.remove("hidden");let {data}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(data)profile=data;else{let r=await db.from("profiles").insert({id:user.id,username:user.email.split("@")[0]}).select().single();profile=r.data}loadFriends();}
function toggleAccount(){el("chatView").classList.add("hidden");el("convView").classList.add("hidden");el("friendsView").classList.add("hidden");el("accountView").classList.remove("hidden");el("accountDetails").textContent="Email: "+user.email+" | Username: "+(profile?.username||"");}
async function openChat(){el("chatView").classList.remove("hidden");el("convView").classList.add("hidden");el("friendsView").classList.add("hidden");el("accountView").classList.add("hidden");loadFriends();}
function openFriends(){el("chatView").classList.add("hidden");el("convView").classList.add("hidden");el("friendsView").classList.remove("hidden");el("accountView").classList.add("hidden");searchFriends();loadRequests();loadFriendsList();}
function backList(){active=null;el("convView").classList.add("hidden");el("chatView").classList.remove("hidden");}
async function loadFriends(){let {data}=await db.from("friend_requests").select("*").eq("status","accepted").or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);let ids=[...new Set((data||[]).map(r=>r.sender_id===user.id?r.receiver_id:r.sender_id))].filter(id=>id!==user.id);if(!ids.length){friends=[];el("chatList").innerHTML="<p>No friends yet. Go to Friends > Search users</p>";return;}let {data:p}=await db.from("profiles").select("*").in("id",ids);friends=p||[];renderList();}
function renderList(){let q=(el("chatSearch").value||"").toLowerCase();let list=friends.filter(f=>(f.username||"").toLowerCase().includes(q));el("chatList").innerHTML=list.length?list.map(f=>`<div class="row" onclick="openConv('${f.id}')"><div class="avatar">${esc((f.username||"F")[0].toUpperCase())}</div><div style="flex:1"><strong>${esc(f.username)}</strong></div><button class="primary">Chat</button></div>`).join(""):"<p>No friends</p>";}
function loadFriendsList(){el("friendsList").innerHTML=friends.length?friends.map(f=>`<div class="row"><div class="avatar">${esc((f.username||"F")[0])}</div><strong>${esc(f.username)}</strong><button class="primary" onclick="openConv('${f.id}')">Chat</button></div>`).join(""):"<p>No friends yet</p>";}
async function openConv(id){active=friends.find(f=>f.id===id);if(!active)return;el("chatView").classList.add("hidden");el("convView").classList.remove("hidden");el("convName").textContent=active.username;loadMsgs();}
async function loadMsgs(){if(!active)return;let filter=`and(sender_id.eq.${user.id},receiver_id.eq.${active.id}),and(sender_id.eq.${active.id},receiver_id.eq.${user.id})`;let {data}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:true});let box=el("messages");box.innerHTML="";(data||[]).forEach(m=>{let d=document.createElement("div");d.className="message"+(m.sender_id===user.id?" mine":"");d.innerHTML=`${esc(m.content)}<br><small class="muted">${new Date(m.created_at).toLocaleTimeString()}</small>`;box.appendChild(d);});box.scrollTop=box.scrollHeight;}
async function sendMsg(){if(!active)return;let c=el("msgInput").value.trim();if(!c)return;await db.from("messages").insert({sender_id:user.id,receiver_id:active.id,content:c});el("msgInput").value="";loadMsgs();}
async function searchFriends(){let q=el("friendSearch").value.trim(),box=el("searchResults");if(q.length<2){box.innerHTML="<p>Type 2 letters to search</p>";return;}box.innerHTML="Searching...";let {data}=await db.from("profiles").select("*").ilike("username","%"+q+"%").limit(20);let people=(data||[]).filter(p=>p.id!==user.id);if(!people.length){box.innerHTML="No users found";return;}let {data:req}=await db.from("friend_requests").select("*").or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);box.innerHTML=people.map(p=>{let r=(req||[]).find(x=>(x.sender_id===user.id&&x.receiver_id===p.id)||(x.receiver_id===user.id&&x.sender_id===p.id));let btn=r?.status==="accepted"?`<button class="secondary" onclick="openConv('${p.id}')">Chat</button>`:r?.status==="pending"?`<button disabled>Pending</button>`:`<button class="primary" onclick="addFriend('${p.id}')">Add</button>`;return `<div class="row"><div class="avatar">${esc((p.username||"U")[0])}</div><strong>${esc(p.username)}</strong>${btn}</div>`}).join("");}
async function addFriend(id){let {error}=await db.from("friend_requests").insert({sender_id:user.id,receiver_id:id,status:"pending"});if(error)return alert(error.message);alert("Friend request sent!");}
async function loadRequests(){let {data}=await db.from("friend_requests").select("*").eq("receiver_id",user.id).eq("status","pending");let box=el("requestsList");if(!data||!data.length){box.innerHTML="No requests";return;}let ids=data.map(r=>r.sender_id);let {data:profs}=await db.from("profiles").select("*").in("id",ids);box.innerHTML=data.map(r=>{let p=(profs||[]).find(x=>x.id===r.sender_id);return `<div class="row"><div class="avatar">${esc((p?.username||"U")[0])}</div><strong>${esc(p?.username||"User")}</strong><button class="primary" onclick="acceptReq('${r.id}')">Accept</button><button class="secondary" onclick="declineReq('${r.id}')">Decline</button></div>`}).join("");}
async function acceptReq(id){await db.from("friend_requests").update({status:"accepted"}).eq("id",id);alert("Accepted!");loadFriends();loadRequests();}
async function declineReq(id){await db.from("friend_requests").delete().eq("id",id);loadRequests();}
async function updateName(){let u=el("newUsername").value.trim();if(!u)return alert("Enter username");let {data,error}=await db.from("profiles").update({username:u}).eq("id",user.id).select().single();if(error)return alert(error.message);profile=data;alert("Username updated!");}
db.auth.getSession().then(({data})=>{if(data.session?.user)startApp(data.session.user);});
</script></body></html>
