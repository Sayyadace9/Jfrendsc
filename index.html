<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFriendsChat</title>

<style>
*{box-sizing:border-box}
:root{--blue:#1769e0;--darkblue:#1254bd;--lightblue:#e8f1ff;--page:#edf2f8;--text:#18243b;--muted:#738096;--border:#e4eaf2;--green:#18a66a}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--text);font-size:15px}
header{height:70px;background:linear-gradient(110deg,#1456bd,#1875ee);color:white;padding:0 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #143d7620}
header h2{margin:0;font-size:25px;font-weight:750;letter-spacing:-.5px}
button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
button:hover{filter:brightness(.96)}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--blue);color:white}
.secondary{background:#edf3fb;color:#24528d}
.danger{background:#ffe9e9;color:#c62828}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid #dce4ef;border-radius:10px;margin:6px 0;font:inherit;color:var(--text);background:white;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769e015}
textarea{min-height:85px;resize:vertical}
input[type=file]{background:#f8faff}
.container{width:100%;max-width:none;margin:0;padding:18px}
.hidden{display:none!important}
#authPanel{max-width:470px;margin:55px auto;padding:30px;border-radius:18px;box-shadow:0 8px 35px #18345b12}
#authPanel h3{font-size:25px;margin-top:0;color:#164f9e}
#authPanel button{margin-top:8px}
#appPanel{padding-left:270px;min-height:calc(100vh - 100px)}
nav{position:fixed;left:0;top:70px;bottom:0;width:255px;padding:22px 13px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;background:white;border-right:1px solid var(--border);z-index:50}
nav button{width:100%;min-height:47px;flex:none;text-align:left;padding:13px 16px;background:transparent;color:#33445d;border-radius:10px;font-size:15px}
nav button:hover{background:#f1f6ff}
nav button.active{background:#e3efff;color:#1769e0;box-shadow:inset 3px 0 0 var(--blue)}
.card,.post{background:white;border:1px solid #e8edf4;border-radius:15px;padding:20px;margin:0 0 18px;box-shadow:0 2px 12px rgba(24,52,91,.07)}
#chatPanel,#friendsMenuPanel,#friendsPanel,#requestsPanel,#searchPanel,#accountPanel,#postsPanel,#businessPanel,#connectPanel,#groupsPanel{max-width:1100px}
.card h3,.post h3{margin-top:0;color:#172d50}
.card h4{color:#324969}
hr{border:0;border-top:1px solid var(--border);margin:22px 0}
#status,#authStatus{font-size:13px;color:#245da9;margin:10px 0 15px;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #edf0f5}
.row:last-child{border-bottom:0}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#c8ddff,#80a9ed);color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex-shrink:0;overflow:hidden}
.flexinfo{flex:1;min-width:0}
.muted{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}
.online{color:var(--green);font-size:12px}
.chat-list-row{display:flex;align-items:center;gap:13px;padding:15px 5px;border-bottom:1px solid #edf0f5;min-height:82px;cursor:pointer;background:white}
.chat-list-row:hover{background:#f6f9ff}
.chat-list-row .avatar{width:56px;height:56px;min-width:56px;font-size:21px}
.chat-list-main{flex:1;min-width:0}
.chat-list-top,.chat-list-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;min-width:0}
.chat-list-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#172d50}
.chat-list-time{font-size:12px;color:#16865b;white-space:nowrap;flex-shrink:0}
.chat-list-preview{font-size:14px;color:#758196;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;min-width:0}
.chat-list-status{font-size:11px;color:#159d64;white-space:nowrap;flex-shrink:0}
#messages,#groupMessages{height:48vh;min-height:230px;overflow-y:auto;padding:15px;background:#f0f5fc;border:1px solid #e3ebf6;border-radius:12px;display:flex;flex-direction:column;gap:10px}
.message{max-width:82%;padding:11px 13px;background:white;border:1px solid #e4eaf2;border-radius:13px 13px 13px 3px;align-self:flex-start;overflow-wrap:anywhere;box-shadow:0 1px 3px #00000008}
.message.mine{background:#dceaff;border-color:#d1e2ff;align-self:flex-end;border-radius:13px 13px 3px 13px}
.message img,.message video,.post-media{max-width:100%;width:100%;border-radius:10px;display:block;margin:8px 0}
.message small{display:block;text-align:right;font-size:10px;color:#738096;margin-top:6px}
.composer{display:flex;gap:8px;align-items:center;margin-top:10px}
.composer input{margin:0;min-width:0}
.composer button{flex-shrink:0}
.post{margin:14px 0}
.post-head{display:flex;align-items:center;gap:11px}
.post-head .avatar{width:43px;height:43px}
.post-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0;line-height:1.65;font-size:15px}
.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #edf0f5}
.post-actions button{background:#f0f5fc;color:#405776}
.post-actions button:hover{background:#e2edff;color:#1769e0}
.post-actions button.liked{background:#e2efff;color:#1769e0}

/* Compact, icon-only social actions */
.post-actions{display:flex;align-items:center;justify-content:space-around;gap:10px;margin-top:12px;padding:10px 2px;border-top:1px solid #edf0f5}
.post-actions .social-action{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 10px;border:0;border-radius:13px;background:transparent;color:#64748b;font-size:20px;font-weight:700;box-shadow:none}
.post-actions .social-action .action-count{font-size:13px;font-weight:600;color:#64748b}
.post-actions .social-action:hover{background:#eef5ff;color:#1769e0}
.post-actions .social-action.liked{background:#fff0f4;color:#e04478}
.post-actions .social-action.comment-action{color:#3975c8}
.post-actions .social-action.share-action{color:#7b61c9}
.post-comment-composer{display:none;align-items:center;gap:8px;margin:10px 0 4px;padding:9px;background:#f3f7ff;border:1px solid #e5edfb;border-radius:16px}
.post-comment-composer.open{display:flex}
.post-comment-composer input{flex:1;min-width:0;margin:0;border-radius:22px;background:#fff}
.post-comment-composer button{flex-shrink:0;border-radius:22px;padding:10px 16px}
.comment{padding:10px 12px;background:#f3f6fb;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}
.comment strong{margin-right:5px}
#productsFeed,#meetingsFeed,#groupsFeed{margin-top:15px}
#productsFeed .post-media{max-height:300px;object-fit:contain;background:#f5f7fb}
.submenu{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}
.submenu button{flex:1;min-width:130px;padding:14px;background:#edf4ff;color:#1769e0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat-box{padding:16px;border-radius:13px;background:#f2f6ff;border:1px solid #e0eaff}
.stat-box strong{display:block;font-size:25px;color:#1456bd;margin-top:8px}
footer{text-align:center;padding:22px;color:#8590a2;font-size:12px}
@media(max-width:760px){
header{height:62px;padding:0 14px}
header h2{font-size:21px}
.container{padding:10px}
#appPanel{padding-left:0;padding-bottom:75px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:66px;padding:6px 4px;display:flex;flex-direction:row;align-items:stretch;justify-content:flex-start;gap:4px;overflow-x:auto;overflow-y:hidden;background:white;border-top:1px solid var(--border);border-right:0;box-shadow:0 -3px 12px #18345b0c}
nav button{flex:0 0 86px;width:86px;min-width:86px;min-height:48px;height:50px;padding:7px 4px;text-align:center;font-size:11px;border-radius:9px;white-space:normal}
nav button.active{box-shadow:inset 0 -3px 0 var(--blue)}
.card,.post{padding:14px;margin-bottom:12px;border-radius:13px}
#authPanel{margin:25px auto;padding:23px}
.chat-list-row{gap:10px;padding:12px 1px}
.chat-list-row .avatar{width:48px;height:48px;min-width:48px}
.chat-list-name{font-size:15px}
.chat-list-preview{font-size:13px}
.composer{gap:5px}
.composer button{padding:11px 10px}
.submenu button{min-width:100px}
footer{padding-bottom:85px}
}
@media(max-width:380px){
header h2{font-size:18px}
.card,.post{padding:11px}
nav button{flex-basis:76px;min-width:76px;width:76px;font-size:10px}
}

/* While a private conversation is open, hide every main navigation tab until Back is pressed. */
body.chat-open nav{display:none!important;}

/* Full-screen conversation layout for mobile: keep the chat between header and bottom navigation. */
@media(max-width:760px){
  body:has(#conversationView:not(.hidden)){overflow:hidden}
  /* In an open conversation, hide the bottom tabs so the friend's header and messages get the full screen. */
  body.chat-open nav{display:none!important}
  body.chat-open #chatPanel{bottom:0!important}
  #chatPanel:has(#conversationView:not(.hidden)){
    position:fixed!important;left:0!important;right:0!important;top:82px!important;bottom:0!important;
    width:100%!important;max-width:none!important;height:auto!important;min-height:0!important;
    margin:0!important;padding:10px 12px 8px!important;border-radius:0!important;
    display:flex!important;flex-direction:column!important;overflow:hidden!important;z-index:90!important;
    box-shadow:none!important;border-left:0!important;border-right:0!important;
  }
  #chatPanel:has(#conversationView:not(.hidden)) #chatHeading{display:none!important}
  #conversationView:not(.hidden){display:flex!important;flex:1 1 auto!important;min-height:0!important;flex-direction:column!important;overflow:hidden!important}
  .conversation-top{flex:0 0 auto!important;margin:0 0 8px!important;padding:0 0 9px!important;gap:9px!important}
  .conversation-avatar{width:46px!important;height:46px!important;overflow:hidden}
  #conversationAvatar .avatar{width:46px!important;height:46px!important;min-width:46px!important}
  .conversation-title h3{font-size:16px!important}
  #messages{flex:1 1 auto!important;height:auto!important;min-height:0!important;max-height:none!important;width:100%!important;overflow-y:auto!important;overscroll-behavior:contain;padding:12px 10px!important;margin:0!important;border-radius:20px!important}
  #messages{overflow-anchor:none;scroll-behavior:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}

  .message{max-width:88%!important}
  .message img,.message video{width:auto!important;max-width:min(100%,260px)!important;max-height:230px!important;object-fit:contain!important}

/* Facebook-inspired account entry: familiar two-step login and registration layout. */
.auth-shell{max-width:980px;margin:38px auto 55px;display:grid;grid-template-columns:1fr 420px;gap:55px;align-items:center;padding:18px}
.auth-intro{padding:20px 0}.auth-logo{width:66px;height:66px;border-radius:20px;background:#0875ed;color:white;display:grid;place-items:center;font-size:42px;font-weight:800;box-shadow:0 8px 22px #0875ed35}
.auth-intro h1{font-size:42px;letter-spacing:-1.5px;color:#0866d9;margin:18px 0 8px}.auth-intro p{font-size:21px;line-height:1.45;color:#42536d;max-width:430px}
.auth-card{background:#fff;border:1px solid #e5ebf3;border-radius:17px;padding:25px;box-shadow:0 8px 30px #18345b18}
.auth-card h2{margin:0 0 5px;font-size:25px;color:#1c2c45}.auth-subtitle{margin:0 0 17px;color:#758197;font-size:14px}
.auth-card label{display:block;font-size:13px;font-weight:700;color:#34445d;margin-top:10px}
.auth-card input,.auth-card select{margin:5px 0 3px;padding:13px;border-radius:9px}.auth-name-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.password-wrap{position:relative}.password-wrap input{padding-right:65px}.password-toggle{position:absolute;right:5px;top:9px;padding:8px;background:transparent;color:#1769e0}
.auth-submit{width:100%;padding:13px;font-size:16px;margin-top:14px!important}
.auth-link{display:block;width:100%;background:transparent;color:#1769e0;margin:7px auto 0}
.auth-divider{display:flex;align-items:center;gap:12px;color:#8994a5;font-size:12px;margin:14px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e6ebf2;flex:1}
.create-account-button{display:block;margin:0 auto;background:#1baf68;color:#fff;padding:13px 18px;font-size:15px}
.auth-terms{font-size:11px;line-height:1.45;color:#778399;margin:12px 0 2px}
#phoneOtpPanel,#passwordResetPanel{margin-top:12px;padding-top:14px;border-top:1px solid #e6ebf2}
#authStatus{min-height:20px;line-height:1.5;overflow-wrap:anywhere}
@media(max-width:760px){.auth-shell{grid-template-columns:1fr;gap:15px;margin:15px auto 35px;padding:8px;max-width:470px}.auth-intro{text-align:center;padding:8px 8px 0}.auth-logo{margin:auto;width:52px;height:52px;font-size:33px;border-radius:16px}.auth-intro h1{font-size:32px;margin:10px 0 4px}.auth-intro p{font-size:15px;margin:0 auto;max-width:350px}.auth-card{padding:20px}.auth-name-row{gap:7px}}

/* Tighten the open-chat layout: remove the unused space below the message composer. */
@media(max-width:760px){
  body.chat-open footer{display:none!important;}
  body.chat-open #chatPanel:has(#conversationView:not(.hidden)){
    position:fixed!important;top:82px!important;bottom:0!important;left:0!important;right:0!important;
    height:auto!important;min-height:0!important;margin:0!important;padding:8px 12px 10px!important;
    display:flex!important;flex-direction:column!important;overflow:hidden!important;
  }
  body.chat-open #conversationView:not(.hidden){
    display:flex!important;flex:1 1 auto!important;min-height:0!important;
    flex-direction:column!important;overflow:hidden!important;
  }
  body.chat-open #messages{flex:1 1 auto!important;min-height:0!important;}
  body.chat-open .message-composer{flex:0 0 auto!important;margin:8px 0 0!important;}
  body.chat-open .media-picker{flex:0 0 auto!important;margin:4px 0 0!important;}
}

/* Final mobile conversation sizing: give message history the full available area,
   and keep the composer pinned at the bottom without shrinking the history. */
@media (max-width:760px){
  html:has(body.chat-open), body.chat-open{height:100%;min-height:100%;overflow:hidden!important;}
  body.chat-open #chatPanel{
    position:fixed!important;top:82px!important;left:0!important;right:0!important;bottom:0!important;
    width:100%!important;height:auto!important;min-height:0!important;max-width:none!important;
    margin:0!important;padding:8px 12px max(10px, env(safe-area-inset-bottom))!important;
    display:flex!important;flex-direction:column!important;overflow:hidden!important;
    border-radius:0!important;z-index:90!important;
  }
  body.chat-open #conversationView:not(.hidden){
    display:flex!important;flex:1 1 0!important;min-height:0!important;height:100%!important;
    flex-direction:column!important;overflow:hidden!important;
  }
  body.chat-open .conversation-top{flex:0 0 auto!important;}
  body.chat-open #messages{
    display:flex!important;flex:1 1 0!important;min-height:0!important;height:0!important;max-height:none!important;
    overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;
    margin:0!important;
  }
  body.chat-open .message-composer{
    position:relative!important;flex:0 0 auto!important;bottom:auto!important;
    margin:8px 0 0!important;width:100%!important;
  }
  body.chat-open .media-picker{flex:0 0 auto!important;margin:5px 0 0!important;}
}

#postsFeed video.post-media{preload:none}
@media(max-width:620px){
 #postsFeed .post{padding:12px!important}
 #postsFeed .post-body{font-size:14px!important;line-height:1.5!important;margin:4px 0 9px!important}
 #postsFeed .post-media{width:100%!important;height:auto!important;max-height:360px!important;aspect-ratio:auto!important;object-fit:contain!important;border-radius:12px!important}
 #postsFeed video.post-media{max-height:300px!important;object-fit:contain!important}
}


/* Social actions: liked state is light blue, never red/pink. */
#postsFeed .post-actions .social-action.liked,
#postsFeed .post-actions button.liked,
.post-actions .social-action.liked{
 background:#e7f3ff!important;color:#0866ff!important;border-color:#cfe4ff!important;
}
#postsFeed .post-actions .social-action.liked .action-count{color:#0866ff!important}
.post-share-modal{position:fixed;inset:0;z-index:10000;background:#10213b99;display:flex;align-items:center;justify-content:center;padding:16px}
.post-share-modal.hidden{display:none!important}
