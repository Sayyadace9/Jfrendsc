<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FriendsChat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf0f4;
}

.app {
  max-width: 480px;
  height: 100dvh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

.header {
  background: #087f5b;
  color: white;
  padding: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h2 {
  margin: 0;
  font-size: 22px;
}

.status {
  font-size: 12px;
  margin-top: 4px;
}

.friends {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.friend {
  min-width: 65px;
  text-align: center;
  font-size: 12px;
  cursor: pointer;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ccefe3;
  color: #087f5b;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 5px;
  font-size: 19px;
  font-weight: bold;
}

.chat-header {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #eee;
}

.chat-header .avatar {
  margin: 0;
  width: 42px;
  height: 42px;
}

.chat-header h3 {
  margin: 0 0 4px;
}

.chat-header small {
  color: #087f5b;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #f5f7f8;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bubble {
  max-width: 82%;
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.received {
  align-self: flex-start;
  background: white;
  border: 1px solid #e4e4e4;
}

.sent {
  align-self: flex-end;
  background: #d5f7e5;
}

.time {
  display: block;
  text-align: right;
  font-size: 10px;
  color: #777;
  margin-top: 5px;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: white;
}

.composer input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 22px;
  padding: 12px 14px;
  font-size: 15px;
  outline: none;
}

.composer button {
  border: none;
  border-radius: 50%;
  width: 46px;
  height: 46px;
  background: #087f5b;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.footer {
  text-align: center;
  padding: 7px;
  font-size: 11px;
  color: #777;
  background: white;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div>
      <h2>FriendsChat 💬</h2>
      <div class="status">Connect with your friends</div>
    </div>
    <span>⋮</span>
  </header>

  <section class="friends">
    <div class="friend" onclick="selectFriend('Me')">
      <div class="avatar">M</div>
      Me
    </div>

    <div class="friend" onclick="selectFriend('Ali')">
      <div class="avatar">A</div>
      Ali
    </div>

    <div class="friend" onclick="selectFriend('Amina')">
      <div class="avatar">A</div>
      Amina
    </div>

    <div class="friend" onclick="selectFriend('Musa')">
      <div class="avatar">M</div>
      Musa
    </div>

    <div class="friend" onclick="selectFriend('Fatima')">
      <div class="avatar">F</div>
      Fatima
    </div>
  </section>

  <section class="chat-header">
    <div class="avatar" id="friendAvatar">A</div>
    <div>
      <h3 id="friendName">Ali</h3>
      <small>Demo conversation</small>
    </div>
  </section>

  <main class="messages" id="messages">
    <div class="bubble received">
      Hello! 👋
      <span class="time">10:00</span>
    </div>

    <div class="bubble received">
      Welcome to FriendsChat!
      <span class="time">10:01</span>
    </div>
  </main>

  <form class="composer" id="chatForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
      aria-label="Type a message"
    >
    <button type="submit" aria-label="Send message">➤</button>
  </form>

  <div class="footer">
    FriendsChat • Chat interface demo
  </div>

</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const form = document.getElementById("chatForm");
const friendName = document.getElementById("friendName");
const friendAvatar = document.getElementById("friendAvatar");

function currentTime() {
  return new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function addMessage(text, type) {
  const bubble = document.createElement("div");
  bubble.className = "bubble " + type;

  const messageText = document.createElement("div");
  messageText.textContent = text;

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = currentTime();

  bubble.appendChild(messageText);
  bubble.appendChild(time);
  messages.appendChild(bubble);

  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "sent");
  input.value = "";
  input.focus();
});

function selectFriend(name) {
  friendName.textContent = name;
  friendAvatar.textContent = name.charAt(0).toUpperCase();

  messages.replaceChildren();

  const notice = document.createElement("div");
  notice.className = "bubble received";
  notice.textContent = "You are viewing the demo chat with " + name + ".";
  messages.appendChild(notice);
}
</script>

</body>
</html>
