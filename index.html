<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFriendsChat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#075e54;color:white;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#087f68;color:white}.secondary{background:#e6eef6}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0}nav{display:flex;gap:4px;padding:7px;background:white;position:sticky;top:49px;overflow-x:auto}nav button{flex:1;min-width:62px;background:#e6efec;color:#075e54;font-weight:bold;font-size:12px}nav button.active{background:#075e54;color:white}.card{background:white;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0001}.hidden{display:none!important}.stories-bar{display:flex;gap:12px;overflow-x:auto;padding:12px;background:white;border-radius:12px;margin:10px 0}.story-circle{width:60px;height:60px;border-radius:50%;border:3px solid #1877f2;display:flex;align-items:center;justify-content:center;overflow:hidden}.story-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover}.avatar{width:44px;height:44px;border-radius:50%;background:#d9eee8;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}.chat-list-row{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid #eee;cursor:pointer;background:#fff}#messages{height:36vh;overflow-y:auto;padding:10px;background:#e8e4dc;border-radius:10px;display:flex;flex-direction:column;gap:7px}.message{max-width:82%;padding:9px;background:white;border-radius:12px;align-self:flex-start}.message.mine{background:#d5f5cb;align-self:flex-end}.post-media{max-width:100%;border-radius:9px}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.product-card{border:1px solid #eee;border-radius:10px;overflow:hidden;background:white}.product-card img{height:130px;object-fit:cover;width:100%}.price{color:#087f68;font-weight:bold}.meeting-card{border:2px solid #1877f2;border-radius:10px;padding:10px;margin:8px 0;background:#f0f7ff}#jitsiFrame{width:100%;height:60vh;border:0;border-radius:10px;display:none}.muted{font-size:12px;color:#666}</style></head><body><header><h2>💬 JFriendsChat</h2><button id="accountButton" class="secondary hidden" onclick="toggleAccount()">👤</button></header><div style="max-width:820px;margin:auto;padding:8px"><section id="authPanel" class="card" style="max-width:420px;margin:20px auto;background:white;border-radius:8px;box-shadow:0 2px 10px #0002;padding:0;overflow:hidden"><div style="background:#1877f2;padding:14px;text-align:center;color:white;font-size:22px;font-weight:bold">jfriendschat</div><div style="padding:16px"><h3 style="text-align:center">Log in to JFriendsChat</h3><input id="email" type="text" placeholder="Email address or phone number" style="height:48px;background:#f5f6f7"><div style="position:relative"><input id="password" type="password" placeholder="Password" style="height:48px;background:#f5f6f7;padding-right:40px"><span onclick="let p=document.getElementById('password');p.type=p.type==='password'?'text':'password'" style="position:absolute;right:10px;top:18px;cursor:pointer">👁️</span></div><button class="primary" onclick="signIn()" style="width:100%;height:48px;background:#1877f2;font-size:20px;font-weight:bold;margin-top:10px">Log in</button><div style="text-align:center;margin:12px"><a href="#" onclick="forgotPass();return false" style="color:#1877f2">Forgotten password?</a></div><hr><div style="text-align:center"><button class="primary" onclick="showFBSignup()" style="background:#42b72a;height:48px;font-size:17px;font-weight:bold">Create new account</button></div><div id="authStatus" style="color:red;text-align:center;margin-top:8px"></div></div><div id="fbSignupModal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px"><div class="card" style="max-width:430px;width:100%;max-height:90vh;overflow-y:auto"><div style="display:flex;justify-content:space-between"><h3>Sign Up</h3><button onclick="hideFBSignup()">✕</button></div><p class="muted">It's quick and easy.</p><div style="display:flex;gap:8px"><input id="fname" placeholder="First name"><input id="sname" placeholder="Surname"></div><input id="username" placeholder="Username"><input id="signupEmail" type="text" placeholder="Mobile or email"><input id="signupPass" type="password" placeholder="New password"><label style="font-size:12px">Gender</label><div style="display:flex;gap:8px"><label style="flex:1;border:1px solid #ccc;padding:8px;border-radius:6px"><input type="radio" name="gender" value="Male" style="width:auto"> Male</label><label style="flex:1;border:1px solid #ccc;padding:8px;border-radius:6px"><input type="radio" name="gender" value="Female" style="width:auto"> Female</label></div><label style="font-size:12px">Profile picture</label><input id="signupAvatar" type="file" accept="image/*"><button class="primary" onclick="facebookSignUp()" style="width:100%;background:#42b72a;height:44px;font-weight:bold;margin-top:8px">Sign Up</button><div id="signupStatus" style="color:red;text-align:center"></div></div></div></section><section id="appPanel" class="hidden"><nav><button id="chatNav" class="active" onclick="openChatHome()">💬<br>Chat</button><button id="postsNav" onclick="openPosts()">📰<br>Posts</button><button id="marketNav" onclick="openMarket()">🏪<br>Market</button><button id="connectNav" onclick="openConnect()">📹<br>OConnect</button><button id="groupsNav" onclick="openGroups()">👥<br>Groups</button><button id="friendsNav" onclick="openFriendsMenu()">🔍<br>Friends</button></nav><div id="status" class="muted"></div><div id="storiesBar" class="stories-bar hidden"></div><section id="chatPanel" class="card"><h3>Chats</h3><div id="chatListView"><input id="chatSearch" placeholder="Search..." oninput="renderChatList()"><div id="chatList"></div></div><div id="conversationView" class="hidden"><button class="secondary" onclick="backToChatList()">← Back</button><h3 id="conversationName"></h3><div id="messages"></div><div style="display:flex;gap:6px"><input id="messageInput" placeholder="Type..."><button class="primary" onclick="sendMessage()">Send</button></div></div></section><section id="postsPanel" class="hidden"><div class="card"><textarea id="postText" placeholder="What's on your mind?"></textarea><input id="postMedia" type="file" accept="image/*,video/*"><button class="primary" onclick="createPost()">Publish Post</button></div><div id="postsFeed"></div></section><section id="marketPanel" class="card hidden"><h3>🏪 Market</h3><button class="primary" onclick="showCreateShop()">+ Create Shop</button><div id="createShopForm" class="card hidden" style="border:2px dashed #087f68"><input id="shopName" placeholder="Shop Name"><input id="shopLocation" placeholder="Location e.g. Gogori"><input id="shopPhone" placeholder="WhatsApp"><button class="primary" onclick="createShop()">Create Shop</button></div><div id="addProductForm" class="card hidden" style="border:2px dashed #1877f2"><select id="productShopSelect"></select><input id="productTitle" placeholder="Product"><input id="productPrice" type="number" placeholder="Price ₦"><input id="productImage" type="file" accept="image/*"><button class="primary" onclick="addProduct()">Add Product</button></div><div id="marketContent"></div></section><section id="connectPanel" class="card hidden"><h3>📹 OConnect 200</h3><input id="meetingTitle" placeholder="Meeting Title"><button class="primary" onclick="createMeeting()">+ Create Meeting</button><iframe id="jitsiFrame" allow="camera; microphone; fullscreen"></iframe><div id="meetingsList"></div></section><section id="groupsPanel" class="card hidden"><h3>👥 Groups</h3><button class="primary" onclick="showCreateGroup()">+ Create Group</button><div id="createGroupForm" class="card hidden"><input id="groupName" placeholder="Group Name"><button class="primary" onclick="createGroup()">Create Group</button></div><div id="groupsList"></div><div id="groupChatView" class="hidden"><button class="secondary" onclick="backToGroups()">← Back</button><h3 id="groupChatName"></h3><div id="groupMessages" style="height:35vh;overflow-y:auto;background:#e8e4dc;padding:10px;border-radius:8px"></div><div style="display:flex;gap:6px"><input id="groupMessageInput" placeholder="Type..."><button class="primary" onclick="sendGroupMessage()">Send</button></div></div></section><section id="friendsMenuPanel" class="card hidden"><h3>Friends</h3><button class="primary" onclick="openFriendsList()">My Friends</button><button class="primary" onclick="openRequests()">Requests</button><button class="primary" onclick="openFindFriends()">Find Friends</button></section><section id="friendsPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Back</button><div id="friendsList"></div></section><section id="requestsPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Back</button><div id="incomingRequests"></div></section><section id="searchPanel" class="card hidden"><button class="secondary" onclick="openFriendsMenu()">← Back</button><input id="friendSearch" placeholder="Search..." oninput="searchFriends()"><div id="searchResults"></div></section><section id="accountPanel" class="card hidden"><h3>Account</h3><div id="accountDetails"></div><button style="background:#c62828;color:white" onclick="signOut()">Log Out</button></section></section></div><script>
const SUPABASE_URL="https://msifvhqvxfjjwcazacxj.supabase.co";const SUPABASE_KEY="sb_publishable__uU2wBTvE8tWoAFoRSWVEA_AgJvZOqg";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const POST_BUCKET="social-posts";let currentUser=null,currentProfile=null,chatFriends=[],activeFriend=null,activeGroup=null,myShops=[];const el=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}function setStatus(t){el("status").textContent=t||""}function showAuthStatus(t){el("authStatus").textContent=t||""}function nameOf(p){return p?.username||"Friend"}function avatar(p){if(!p)return '<div class="avatar">F</div>';let ph=p.avatar_url;if(ph)return `<div class="avatar"><img src="${esc(ph)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;return `<div class="avatar">${esc((nameOf(p)[0]||"F").toUpperCase())}</div>`;}function timeOf(v){return v?new Date(v).toLocaleString():"";}function hidePanels(){["chatPanel","postsPanel","marketPanel","connectPanel","groupsPanel","friendsMenuPanel","friendsPanel","requestsPanel","searchPanel","accountPanel"].forEach(id=>el(id).classList.add("hidden"))}function setNav(which){["chatNav","postsNav","marketNav","connectNav","groupsNav","friendsNav"].forEach(id=>el(id).classList.toggle("active",id===which))}function showFBSignup(){el("fbSignupModal").classList.remove("hidden");}function hideFBSignup(){el("fbSignupModal").classList.add("hidden");}async function forgotPass(){let e=el("email").value.trim();if(!e)return showAuthStatus("Enter email");let {error}=await db.auth.resetPasswordForEmail(e,{redirectTo:window.location.href});showAuthStatus(error?error.message:"✅ Email sent!");}async function facebookSignUp(){let f=el("fname").value.trim(),s=el("sname").value.trim(),u=el("username").value.trim(),e=el("signupEmail").value.trim(),p=el("signupPass").value,av=el("signupAvatar").files[0];if(!f||!s||!e||!p)return el("signupStatus").textContent="Fill all";let email=e.includes("@")?e:u+"@jfriendschat.com";el("signupStatus").textContent="Creating...";let {data,error}=await db.auth.signUp({email,password:p,options:{data:{username:u||f+" "+s}}});if(error){el("signupStatus").textContent=error.message;return;}if(av&&data.user){let path=data.user.id+"/"+Date.now()+"_"+av.name.replace(/[^a-z0-9._-]/gi,"_");await db.storage.from(POST_BUCKET).upload(path,av);let url=db.storage.from(POST_BUCKET).getPublicUrl(path).data.publicUrl;await db.from("profiles").upsert({id:data.user.id,username:u||f+" "+s,avatar_url:url});}el("signupStatus").textContent="✅ Created! Login now";setTimeout(hideFBSignup,1200);}async function signIn(){let e=el("email").value.trim(),p=el("password").value;if(!e||!p)return showAuthStatus("Enter email and password");showAuthStatus("Logging in...");let email=e.includes("@")?e:e+"@jfriendschat.com";let {data,error}=await db.auth.signInWithPassword({email,password:p});if(error){let r2=await db.auth.signInWithPassword({email:e,password:p});if(r2.error){showAuthStatus("Wrong email or password");return;}data=r2.data}showAuthStatus("");await startApp(data.user);}async function signOut(){await db.auth.signOut();location.reload();}async function startApp(user){currentUser=user;el("authPanel").classList.add("hidden");el("appPanel").classList.remove("hidden");el("accountButton").classList.remove("hidden");el("storiesBar").classList.remove("hidden");let {data}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(data)currentProfile=data;else{let r=await db.from("profiles").insert({id:currentUser.id,username:user.email.split("@")[0]}).select().single();currentProfile=r.data}await loadChatFriends();openChatHome();}async function ensureProfile(){let {data}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(data){currentProfile=data;return;}let username=currentUser.user_metadata?.username||currentUser.email.split("@")[0];let r=await db.from("profiles").insert({id:currentUser.id,username}).select().single();currentProfile=r.data;}function toggleAccount(){hidePanels();el("accountPanel").classList.remove("hidden");el("accountDetails").textContent="Username: "+nameOf(currentProfile);}async function openChatHome(){hidePanels();setNav("chatNav");el("chatPanel").classList.remove("hidden");el("storiesBar").classList.remove("hidden");el("chatListView").classList.remove("hidden");el("conversationView").classList.add("hidden");activeFriend=null;await loadChatFriends();await renderChatList();}function openFriendsMenu(){hidePanels();setNav("friendsNav");el("friendsMenuPanel").classList.remove("hidden");}async function openPosts(){hidePanels();setNav("postsNav");el("postsPanel").classList.remove("hidden");await loadPosts();}function openMarket(){hidePanels();setNav("marketNav");el("marketPanel").classList.remove("hidden");loadAllProducts();}function openConnect(){hidePanels();setNav("connectNav");el("connectPanel").classList.remove("hidden");loadMeetings();}function openGroups(){hidePanels();setNav("groupsNav");el("groupsPanel").classList.remove("hidden");loadGroups();}function backToChatList(){activeFriend=null;el("conversationView").classList.add("hidden");el("chatListView").classList.remove("hidden");el("storiesBar").classList.remove("hidden");renderChatList();}async function openFriendsList(){hidePanels();setNav("friendsNav");el("friendsPanel").classList.remove("hidden");await loadFriendsList();}async function openRequests(){hidePanels();setNav("friendsNav");el("requestsPanel").classList.remove("hidden");await loadRequests();}async function openFindFriends(){hidePanels();setNav("friendsNav");el("searchPanel").classList.remove("hidden");await searchFriends();}async function loadChatFriends(){if(!currentUser)return;let {data}=await db.from("friend_requests").select("*").eq("status","accepted").or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);let ids=[...new Set((data||[]).map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id))].filter(id=>id!==currentUser.id);if(!ids.length){chatFriends=[];return;}let p=await db.from("profiles").select("*").in("id",ids);chatFriends=p.data||[];}function renderStoriesBar(){let bar=el("storiesBar");if(!bar)return;if(!chatFriends.length){bar.innerHTML='<div class="story-item"><div class="story-circle" style="border-style:dashed;border-color:#ccc">+</div><div style="font-size:11px">Add Friends</div></div>';return;}bar.innerHTML=chatFriends.map(f=>`<div class="story-item" style="min-width:66px;text-align:center;cursor:pointer" onclick="openConversation('${f.id}')"><div class="story-circle">${f.avatar_url?`<img src="${esc(f.avatar_url)}">`:`<div class="avatar">${esc((nameOf(f)[0]||"F"))}</div>`}</div><div style="font-size:11px">${esc(nameOf(f))}</div></div>`).join('');}async function loadFriendsList(){await loadChatFriends();renderStoriesBar();el("friendsList").innerHTML=chatFriends.length?chatFriends.map(p=>`<div class="row">${avatar(p)}<strong>${esc(nameOf(p))}</strong><button class="primary" onclick="openConversation('${p.id}')">Chat</button></div>`).join(""):"<p>No friends</p>";}async function searchFriends(){let q=el("friendSearch").value.trim(),box=el("searchResults");if(q.length<2){box.innerHTML="<p>Type 2 letters</p>";return;}box.textContent="Searching...";let {data}=await db.from("profiles").select("*").ilike("username","%"+q+"%").limit(20);let people=(data||[]).filter(p=>p.id!==currentUser.id);if(!people.length){box.innerHTML="<p>No users</p>";return;}let req=await db.from("friend_requests").select("*").or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);box.innerHTML=people.map(p=>{let r=(req.data||[]).find(x=>(x.sender_id===currentUser.id&&x.receiver_id===p.id)||(x.receiver_id===currentUser.id&&x.sender_id===p.id));let b=r?.status==="accepted"?`<button class="secondary" onclick="openConversation('${p.id}')">Chat</button>`:r?.status==="pending"?`<button disabled>Pending</button>`:`<button class="primary" onclick="sendFriendRequest('${p.id}')">Add</button>`;return `<div class="row">${avatar(p)}<strong>${esc(nameOf(p))}</strong>${b}</div>`}).join("");}async function sendFriendRequest(id){let {error}=await db.from("friend_requests").insert({sender_id:currentUser.id,receiver_id:id,status:"pending"});if(error)return alert(error.message);alert("Sent");}async function loadRequests(){let {data}=await db.from("friend_requests").select("*").eq("receiver_id",currentUser.id).eq("status","pending");if(!data||!data.length){el("incomingRequests").innerHTML="No requests";return;}let ids=data.map(r=>r.sender_id);let {data:profs}=await db.from("profiles").select("*").in("id",ids);el("incomingRequests").innerHTML=data.map(r=>{let p=(profs||[]).find(x=>x.id===r.sender_id);return `<div class="row">${avatar(p)}<strong>${esc(nameOf(p))}</strong><button class="primary" onclick="acceptRequest('${r.id}')">Accept</button></div>`}).join('');}async function acceptRequest(id){await db.from("friend_requests").update({status:"accepted"}).eq("id",id);await loadChatFriends();alert("Accepted");}async function lastMessage(friendId){let filter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`;let {data}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:false}).limit(1);return data?.[0]||null;}async function renderChatList(){renderStoriesBar();let box=el("chatList"),q=(el("chatSearch").value||"").toLowerCase();if(!chatFriends.length){box.innerHTML='<p>No friends yet - Go to Friends > Find Friends</p>';return;}box.innerHTML="<p>Loading...</p>";let rows=await Promise.all(chatFriends.map(async f=>({f,m:await lastMessage(f.id)})));rows.sort((a,b)=>new Date(b.m?.created_at||0)-new Date(a.m?.created_at||0));rows=rows.filter(r=>nameOf(r.f).toLowerCase().includes(q));box.innerHTML=rows.map(({f,m})=>`<div class="chat-list-row" onclick="openConversation('${f.id}')">${avatar(f)}<div style="flex:1"><strong>${esc(nameOf(f))}</strong><div class="muted">${esc(m?m.content||"Tap to chat":"Tap to chat")}</div></div></div>`).join('');}async function openConversation(id){await loadChatFriends();activeFriend=chatFriends.find(p=>p.id===id);if(!activeFriend)return alert("Not friend");el("chatListView").classList.add("hidden");el("storiesBar").classList.add("hidden");el("conversationView").classList.remove("hidden");el("conversationName").textContent=nameOf(activeFriend);await loadMessages();}function mediaURL(path){if(!path)return null;try{let r=db.storage.from(POST_BUCKET).getPublicUrl(path);return r.data?.publicUrl||null;}catch(e){return null;}}async function loadMessages(){if(!activeFriend)return;let filter=`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},receiver_id.eq.${currentUser.id})`;let {data}=await db.from("messages").select("*").or(filter).order("created_at",{ascending:true});el("messages").innerHTML="";(data||[]).forEach(m=>{let d=document.createElement("div");d.className="message"+(m.sender_id===currentUser.id?" mine":"");d.innerHTML=`${esc(m.content||"")}<br><small>${timeOf(m.created_at)}</small>`;el("messages").appendChild(d);});el("messages").scrollTop=el("messages").scrollHeight;}async function sendMessage(){if(!activeFriend)return;let c=el("messageInput").value.trim();if(!c)return;await db.from("messages").insert({sender_id:currentUser.id,receiver_id:activeFriend.id,content:c});el("messageInput").value="";await loadMessages();}async function createPost(){let text=el("postText").value.trim(),file=el("postMedia").files[0];if(!text&&!file)return alert("Write something");let postId=crypto.randomUUID(),path=null;if(file){path=currentUser.id+"/"+postId+"/"+file.name.replace(/[^a-z0-9._-]/gi,"_");let {error}=await db.storage.from(POST_BUCKET).upload(path,file);if(error){alert(error.message);return;}}await db.from("posts").insert({id:postId,user_id:currentUser.id,content:text,media_path:path});el("postText").value="";el("postMedia").value="";loadPosts();}async function loadPosts(){let box=el("postsFeed");box.innerHTML="Loading...";let {data:posts}=await db.from("posts").select("*").order("created_at",{ascending:false}).limit(50);if(!posts||!posts.length){box.innerHTML="No posts";return;}let ids=[...new Set(posts.map(p=>p.user_id))];let {data:profs}=await db.from("profiles").select("*").in("id",ids);box.innerHTML=posts.map(p=>{let a=(profs||[]).find(x=>x.id===p.user_id);let media=p.media_path?`<img class="post-media" src="${esc(mediaURL(p.media_path))}">`:"";return `<div class="card"><div style="display:flex;gap:8px">${avatar(a)}<strong>${esc(nameOf(a))}</strong><span class="muted">${timeOf(p.created_at)}</span></div><div style="margin:8px 0">${esc(p.content||"")}</div>${media}</div>`}).join('');}function showCreateShop(){el("createShopForm").classList.remove("hidden");}async function createShop(){let name=el("shopName").value.trim(),loc=el("shopLocation").value.trim(),phone=el("shopPhone").value.trim();if(!name||!loc)return alert("Shop name and location");let {data,error}=await db.from("shops").insert({owner_id:currentUser.id,shop_name:name,location:loc,phone:phone}).select().single();if(error)return alert(error.message);alert("Shop created!");el("createShopForm").classList.add("hidden");loadMyShops();}async function loadMyShops(){let {data}=await db.from("shops").select("*").eq("owner_id",currentUser.id);myShops=data||[];el("productShopSelect").innerHTML=myShops.map(s=>`<option value="${s.id}">${esc(s.shop_name)}</option>`).join('');}function prepareProductForm(){el("addProductForm").classList.remove("hidden");}async function addProduct(){let shopId=el("productShopSelect").value,title=el("productTitle").value.trim(),price=el("productPrice").value,file=el("productImage").files[0];if(!shopId||!title)return alert("Title required");let path=null;if(file){path=currentUser.id+"/products/"+Date.now()+"_"+file.name.replace(/[^a-z0-9._-]/gi,"_");await db.storage.from(POST_BUCKET).upload(path,file);}await db.from("products").insert({shop_id:shopId,owner_id:currentUser.id,title:title,price:price,image_path:path});alert("Product added!");el("addProductForm").classList.add("hidden");loadAllProducts();}async function loadAllProducts(){let box=el("marketContent");let {data:products}=await db.from("products").select("*").order("created_at",{ascending:false}).limit(100);if(!products||!products.length){box.innerHTML='<p>No products</p><button class="primary" onclick="showCreateShop()">Create Shop</button>';return;}box.innerHTML=`<h4>All Products</h4><div class="shop-grid">`+products.map(p=>{let img=p.image_path?mediaURL(p.image_path):"";return `<div class="product-card">${img?`<img src="${esc(img)}">`:`<div style="height:130px;background:#eee;display:flex;align-items:center;justify-content:center">No Image</div>`}<div style="padding:8px"><strong>${esc(p.title)}</strong><div class="price">₦${p.price||0}</div><button class="primary" style="width:100%" onclick="alert('Chat seller coming soon')">💬 Chat</button></div></div>`}).join('')+`</div>`;}function createMeeting(){let title=el("meetingTitle").value.trim()||"JFriends Meeting";let roomId="jfriends_"+Date.now()+"_"+Math.random().toString(36).substring(2,8);db.from("meetings").insert({id:roomId,host_id:currentUser.id,title:title}).then(()=>{});joinMeeting(roomId,title);}function joinMeeting(roomId,title){let f=el("jitsiFrame");f.style.display="block";f.src=`https://meet.jit.si/${roomId}#userInfo.displayName="${esc(nameOf(currentProfile))}"`;el("meetingsList").innerHTML=`<div class="meeting-card"><strong>🔴 LIVE: ${esc(title)}</strong><br><button style="background:#c62828;color:white" onclick="leaveMeeting()">Leave</button></div>`+el("meetingsList").innerHTML;}function leaveMeeting(){let f=el("jitsiFrame");f.style.display="none";f.src="";}async function loadMeetings(){let {data}=await db.from("meetings").select("*").order("created_at",{ascending:false}).limit(10);let box=el("meetingsList");if(!data||!data.length){box.innerHTML="No meetings";return;}box.innerHTML=data.map(m=>`<div class="meeting-card"><strong>${esc(m.title)}</strong><button class="primary" onclick="joinMeeting('${m.id}','${esc(m.title)}')">Join</button></div>`).join('');}function showCreateGroup(){el("createGroupForm").classList.remove("hidden");}async function createGroup(){let name=el("groupName").value.trim();if(!name)return alert("Name required");let {data,error}=await db.from("groups").insert({name:name,owner_id:currentUser.id}).select().single();if(error)return alert(error.message);await db.from("group_members").insert({group_id:data.id,user_id:currentUser.id});alert("Group created!");el("createGroupForm").classList.add("hidden");loadGroups();}async function loadGroups(){let {data:memberOf}=await db.from("group_members").select("group_id").eq("user_id",currentUser.id);let ids=(memberOf||[]).map(m=>m.group_id);if(!ids.length){el("groupsList").innerHTML="No groups";return;}let {data:groups}=await db.from("groups").select("*").in("id",ids);el("groupsList").innerHTML=groups.map(g=>`<div class="card" style="cursor:pointer" onclick="openGroupChat('${g.id}','${esc(g.name)}')"><strong>${esc(g.name)}</strong></div>`).join('');}async function openGroupChat(id,name){activeGroup={id:id,name:name};el("groupsList").classList.add("hidden");el("groupChatView").classList.remove("hidden");el("groupChatName").textContent=name;loadGroupMessages();}function backToGroups(){activeGroup=null;el("groupChatView").classList.add("hidden");el("groupsList").classList.remove("hidden");}async function loadGroupMessages(){if(!activeGroup)return;let {data}=await db.from("group_messages").select("*").eq("group_id",activeGroup.id).order("created_at",{ascending:true});let box=el("groupMessages");box.innerHTML="";(data||[]).forEach(m=>{let d=document.createElement("div");d.className="message"+(m.user_id===currentUser.id?" mine":"");d.innerHTML=`${esc(m.content)}<br><small>${timeOf(m.created_at)}</small>`;box.appendChild(d);});box.scrollTop=box.scrollHeight;}async function sendGroupMessage(){if(!activeGroup)return;let c=el("groupMessageInput").value.trim();if(!c)return;await db.from("group_messages").insert({group_id:activeGroup.id,user_id:currentUser.id,content:c});el("groupMessageInput").value="";loadGroupMessages();}db.auth.getSession().then(async({data})=>{if(data.session?.user)await startApp(data.session.user);});
